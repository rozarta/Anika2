<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Viaje de Anika - Aventura en el Bosque</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #1a1721;
      font-family: 'Fredoka', 'Quicksand', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 177.78vh; /* 16:9 ratio */
      max-height: 56.25vw;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      background: #111;
      overflow: hidden;
      border-radius: 8px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
    }

    /* Controles virtuales para pantallas táctiles */
    #touch-controls {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 100;
    }

    .touch-btn-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .touch-btn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      border: 3px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      transition: transform 0.08s, background 0.15s;
    }

    .touch-btn:active, .touch-btn.active {
      transform: scale(0.92);
      background: rgba(255, 220, 120, 0.5);
      border-color: #ffe680;
    }

    .touch-btn-jump {
      width: 78px;
      height: 78px;
      background: rgba(255, 150, 80, 0.4);
      border-color: #ffb880;
      font-size: 17px;
      letter-spacing: 0.5px;
    }

    /* Barra superior para Pausa y Sonido */
    #top-bar {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 10px;
      z-index: 120;
    }

    .top-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(6px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.15s, background 0.15s;
    }

    .top-btn:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.35);
    }

    #pause-toggle {
      display: none; /* Se activa dinámicamente en los niveles 1, 2 y 3 */
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <!-- Barra superior con Botón de Pausa y Audio -->
    <div id="top-bar">
      <div id="pause-toggle" class="top-btn" title="Pausar juego (P / Esc)">⏸</div>
      <div id="audio-toggle" class="top-btn" title="Activar/Desactivar Sonido">🔊</div>
    </div>

    <!-- Controles táctiles -->
    <div id="touch-controls">
      <div class="touch-btn-group">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
      </div>
      <div class="touch-btn-group">
        <div class="touch-btn touch-btn-jump" id="btn-jump">SALTO</div>
      </div>
    </div>
  </div>

  <script>
  /**
   * EL VIAJE DE ANIKA (Inspirado en Anika's Odyssey)
   * Videojuego 2D completo en Canvas HTML5 + Web Audio API.
   * Totalmente autónomo sin dependencias externas.
   */

  // ==========================================
  // 1. CONSTANTES Y CONFIGURACIÓN GENERAL
  // ==========================================
  const V_WIDTH = 1280;
  const V_HEIGHT = 720;

  const GRAVITY = 0.58;
  const PLAYER_SPEED = 4.8;
  const JUMP_FORCE = -11.5;
  const JUMP_HOLD_BOOST = -0.32; // Permite salto variable al mantener presionado

  // Constantes específicas para el Nivel 1 (El Lago): salto más bajo, medido y exigente
  const JUMP_FORCE_LAKE = -7.5;      // ~65% de la fuerza normal (fácil de ajustar)
  const JUMP_HOLD_BOOST_LAKE = -0.14; // Rango más corto entre salto mínimo y máximo

  // Constantes específicas para el Nivel 2 (El Lobo): fuerza ajustada un +13% para superar holgadamente cualquier tronco
  const JUMP_FORCE_WOLF = -8.8;       // Ajustable independientemente del nivel 1
  const JUMP_HOLD_BOOST_WOLF = -0.18;
  const RUNNER_BASE_SCROLL_SPEED = 5.6;
  const LOG_JUMP_FLIGHT_TIME = (2 * Math.abs(JUMP_FORCE_WOLF)) / GRAVITY;
  const LOG_JUMP_DISTANCE = RUNNER_BASE_SCROLL_SPEED * LOG_JUMP_FLIGHT_TIME;
  const LOG_MIN_GAP = Math.ceil(LOG_JUMP_DISTANCE * 1.5);
  const LOG_MAX_GAP = Math.ceil(LOG_JUMP_DISTANCE * 2.0);

  // Constantes específicas para el Nivel 3 (El Gran Pino): mayor alcance vertical y horizontal
  const JUMP_FORCE_PINE = -14.6;      // Salto vertical más alto
  const MOVE_SPEED_PINE = 6.8;        // Mayor velocidad lateral para alcanzar ramas más lejanas
  const SPRING_BOOST_PINE = -20.5;    // Impulso súper elástico con piña resorte
  const PINE_GRAVITY = GRAVITY * 0.85;
  const PINE_MAX_RISE = (JUMP_FORCE_PINE * JUMP_FORCE_PINE) / (2 * PINE_GRAVITY);
  const BRANCH_VERTICAL_GAP = PINE_MAX_RISE * 0.82;
  const SAME_SIDE_CHANCE = 1 / 7;
  const BRANCH_HORIZONTAL_REACH_RATIO = 0.72;
  const SUMMIT_CROWN_START_PROGRESS = 0.80;
  const PINE_BRANCH_INSET = 10;

  // Constantes de invulnerabilidad y parpadeo al reaparecer (común a todos los niveles: exactamente 2 parpadeos en ~1 segundo)
  const BLINK_COUNT = 2;          // Exactamente 2 parpadeos completos (visible -> invisible -> visible -> invisible -> visible)
  const BLINK_DURATION = 1.0;     // 1.0 segundo de duración total

  // Duraciones ajustables de la cinemática final.
  const FINAL_CINEMATIC = {
    nest: 4.2,
    descent: 5.8,
    home: 2.8,
    fade: 1.0,
    total: 13.8,
    summitBranchY: 344
  };
  const FINAL_HEART_TIMES = [2.55, 2.95, 3.35, 3.72];
  let duckInNest = true;

  // Determina la visibilidad de la niña durante el parpadeo de invulnerabilidad
  function isPlayerBlinkVisible(invulTimer) {
    if (invulTimer <= 0) return true;
    const progress = 1 - (invulTimer / BLINK_DURATION);
    const phase = Math.floor(progress * BLINK_COUNT * 2);
    return (phase % 2 === 0);
  }

  // Estados del juego
  const STATE = {
    MENU: 'MENU',
    LEVEL_SELECT: 'LEVEL_SELECT',
    CREDITS: 'CREDITS',
    CINE1: 'CINE1',
    LEVEL1: 'LEVEL1',
    LEVEL2: 'LEVEL2',
    LEVEL3: 'LEVEL3',
    CINE_FINAL: 'CINE_FINAL',
    VICTORY: 'VICTORY'
  };

  let currentState = STATE.MENU;
  let stateTime = 0;
  let transitionAlpha = 0;
  let pendingNextState = null;
  let transitionSpeed = 0.035;
  let transitionBlackHold = 0; // Tiempo en segundos manteniéndose en negro

  // Canvas y contexto
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Polyfill para ctx.roundRect en navegadores antiguos
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii = 0) {
      if (typeof radii === 'number') radii = [radii, radii, radii, radii];
      else if (!Array.isArray(radii)) radii = [0, 0, 0, 0];
      while (radii.length < 4) radii.push(radii[radii.length - 1] || 0);
      const [tl, tr, br, bl] = radii;
      this.beginPath();
      this.moveTo(x + tl, y);
      this.lineTo(x + w - tr, y);
      this.quadraticCurveTo(x + w, y, x + w, y + tr);
      this.lineTo(x + w, y + h - br);
      this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
      this.lineTo(x + bl, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - bl);
      this.lineTo(x, y + tl);
      this.quadraticCurveTo(x, y, x + tl, y);
      this.closePath();
      return this;
    };
  }

  const audioToggleBtn = document.getElementById('audio-toggle');
  const pauseToggleBtn = document.getElementById('pause-toggle');
  const touchControlsElem = document.getElementById('touch-controls');

  // Estado del sistema de pausa
  let isPaused = false;

  function togglePause() {
    // Solo permitir pausar durante los 3 niveles
    if (currentState !== STATE.LEVEL1 && currentState !== STATE.LEVEL2 && currentState !== STATE.LEVEL3) {
      return;
    }
    isPaused = !isPaused;
    if (isPaused) {
      pauseToggleBtn.textContent = '▶';
      pauseToggleBtn.title = 'Reanudar juego (P / Esc)';
      audio.pause();
    } else {
      pauseToggleBtn.textContent = '⏸';
      pauseToggleBtn.title = 'Pausar juego (P / Esc)';
      audio.resume();
    }
  }

  pauseToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    togglePause();
  });

  // Detección de táctil
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (isTouchDevice) {
    touchControlsElem.style.display = 'flex';
  }

  // ==========================================
  // PRE-RENDERIZADO EN CANVAS OFFSCREEN (Optimización sin trabas)
  // ==========================================
  const offscreen = {
    skyDay: null,
    skySunset: null,
    skyTwilight: null,
    mountainsDay: null,
    mountainsSunset: null,
    hillsLake: null
  };

  function renderMountainsToCanvas(mCtx, c1, c2) {
    const W = V_WIDTH;
    const H = V_HEIGHT;
    mCtx.clearRect(0, 0, W, H);
    const k = (Math.PI * 2) / W;

    // Capa 1 lejana (Tileado periódico sin costuras)
    mCtx.fillStyle = c1;
    mCtx.beginPath();
    mCtx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const y = 260 + Math.sin(x * k * 2) * 55 + Math.cos(x * k * 3) * 30;
      mCtx.lineTo(x, y);
    }
    mCtx.lineTo(W, H);
    mCtx.closePath();
    mCtx.fill();

    // Capa 2 intermedia
    mCtx.fillStyle = c2;
    mCtx.beginPath();
    mCtx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const y = 340 + Math.sin(x * k * 3 + 1) * 45 + Math.cos(x * k * 5) * 20;
      mCtx.lineTo(x, y);
    }
    mCtx.lineTo(W, H);
    mCtx.closePath();
    mCtx.fill();
  }

  function renderLakeHillsToCanvas(hCtx) {
    const W = V_WIDTH;
    const H = V_HEIGHT;
    hCtx.clearRect(0, 0, W, H);
    const k = (Math.PI * 2) / W;

    // Colinas suaves en el horizonte lejano del lago (sin árboles sobre el agua)
    hCtx.fillStyle = '#6fa38b';
    hCtx.beginPath();
    hCtx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const y = 430 + Math.sin(x * k * 2) * 22 + Math.cos(x * k * 4) * 12;
      hCtx.lineTo(x, y);
    }
    hCtx.lineTo(W, H);
    hCtx.closePath();
    hCtx.fill();

    // Franja de tierra y vegetación baja lejana
    hCtx.fillStyle = '#558a72';
    hCtx.beginPath();
    hCtx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const y = 455 + Math.sin(x * k * 3 + 0.8) * 16 + Math.cos(x * k * 5) * 8;
      hCtx.lineTo(x, y);
    }
    hCtx.lineTo(W, H);
    hCtx.closePath();
    hCtx.fill();
  }

  function initOffscreenCanvases() {
    // 1. Cielo Diurno
    offscreen.skyDay = document.createElement('canvas');
    offscreen.skyDay.width = V_WIDTH;
    offscreen.skyDay.height = V_HEIGHT;
    const ctxDay = offscreen.skyDay.getContext('2d');
    const gradDay = ctxDay.createLinearGradient(0, 0, 0, V_HEIGHT);
    gradDay.addColorStop(0, '#78c6e8');
    gradDay.addColorStop(0.55, '#c5ebf8');
    gradDay.addColorStop(1, '#ffedd6');
    ctxDay.fillStyle = gradDay;
    ctxDay.fillRect(0, 0, V_WIDTH, V_HEIGHT);

    // 2. Cielo Atardecer
    offscreen.skySunset = document.createElement('canvas');
    offscreen.skySunset.width = V_WIDTH;
    offscreen.skySunset.height = V_HEIGHT;
    const ctxSun = offscreen.skySunset.getContext('2d');
    const gradSun = ctxSun.createLinearGradient(0, 0, 0, V_HEIGHT);
    gradSun.addColorStop(0, '#533b68');
    gradSun.addColorStop(0.45, '#bd5a6f');
    gradSun.addColorStop(0.8, '#f79a61');
    gradSun.addColorStop(1, '#fed48b');
    ctxSun.fillStyle = gradSun;
    ctxSun.fillRect(0, 0, V_WIDTH, V_HEIGHT);

    // 3. Cielo Crepuscular
    offscreen.skyTwilight = document.createElement('canvas');
    offscreen.skyTwilight.width = V_WIDTH;
    offscreen.skyTwilight.height = V_HEIGHT;
    const ctxTwi = offscreen.skyTwilight.getContext('2d');
    const gradTwi = ctxTwi.createLinearGradient(0, 0, 0, V_HEIGHT);
    gradTwi.addColorStop(0, '#1d1936');
    gradTwi.addColorStop(0.5, '#402a4f');
    gradTwi.addColorStop(1, '#7e4757');
    ctxTwi.fillStyle = gradTwi;
    ctxTwi.fillRect(0, 0, V_WIDTH, V_HEIGHT);

    // 4. Montañas Diurnas (Tile continuo de 1280px)
    offscreen.mountainsDay = document.createElement('canvas');
    offscreen.mountainsDay.width = V_WIDTH;
    offscreen.mountainsDay.height = V_HEIGHT;
    renderMountainsToCanvas(offscreen.mountainsDay.getContext('2d'), '#9fc0b5', '#7da397');

    // 5. Montañas Atardecer
    offscreen.mountainsSunset = document.createElement('canvas');
    offscreen.mountainsSunset.width = V_WIDTH;
    offscreen.mountainsSunset.height = V_HEIGHT;
    renderMountainsToCanvas(offscreen.mountainsSunset.getContext('2d'), '#78435d', '#552e46');

    // 6. Colinas del Lago
    offscreen.hillsLake = document.createElement('canvas');
    offscreen.hillsLake.width = V_WIDTH;
    offscreen.hillsLake.height = V_HEIGHT;
    renderLakeHillsToCanvas(offscreen.hillsLake.getContext('2d'));
  }

  initOffscreenCanvases();

  // Función para dibujar capas con parallax en mosaico continuo (sin huecos negros)
  function drawParallaxLayer(ctx, canvasImg, scrollX, speedFactor = 1.0) {
    if (!canvasImg) return;
    const tileW = V_WIDTH;
    const offset = Math.floor(((scrollX * speedFactor) % tileW + tileW) % tileW);
    // Dibujar suficientes copias para cubrir la pantalla completa más márgenes
    ctx.drawImage(canvasImg, -offset, 0);
    if (offset > 0) {
      ctx.drawImage(canvasImg, tileW - offset, 0);
    }
    ctx.drawImage(canvasImg, -tileW - offset, 0);
  }

  // ==========================================
  // 2. SISTEMA DE AUDIO (Web Audio API)
  // ==========================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.enabled = true;
      this.bgmTimer = null;
      this.currentTrack = null;
      this.bgmStep = 0;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          this.ctx = new AudioCtx();
        }
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    pause() {
      if (this.ctx && this.ctx.state === 'running') {
        this.ctx.suspend();
      }
    }

    resume() {
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    playTone(freq, type, duration, slide = 0, vol = 0.15) {
      if (!this.enabled || !this.ctx) return;
      try {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (slide !== 0) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(10, freq + slide), this.ctx.currentTime + duration);
        }
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      } catch (e) {}
    }

    playNoise(duration, filterFreq = 1000, vol = 0.15) {
      if (!this.enabled || !this.ctx) return;
      try {
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(filterFreq, this.ctx.currentTime);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      } catch (e) {}
    }

    sfxJump() {
      this.playTone(320, 'sine', 0.22, 280, 0.18);
      this.playTone(440, 'triangle', 0.15, 120, 0.1);
    }

    sfxBounce() {
      this.playTone(280, 'sine', 0.35, 450, 0.22);
    }

    sfxStep() {
      this.playTone(180 + Math.random() * 40, 'sine', 0.06, -50, 0.05);
    }

    sfxSplash() {
      this.playNoise(0.5, 600, 0.35);
      this.playTone(180, 'sine', 0.3, -80, 0.2);
    }

    sfxGrowl() {
      this.playTone(110, 'sawtooth', 0.45, -40, 0.2);
      this.playNoise(0.4, 450, 0.25);
    }

    sfxEagle() {
      this.playTone(880, 'sawtooth', 0.35, -250, 0.18);
      this.playTone(1200, 'sine', 0.3, -400, 0.15);
      this.playNoise(0.45, 900, 0.18); // Aleteo
    }

    sfxDuck() {
      this.playTone(550, 'sawtooth', 0.12, 100, 0.22);
      setTimeout(() => this.playTone(600, 'sawtooth', 0.16, -120, 0.2), 120);
    }

    sfxCrumble() {
      this.playNoise(0.28, 400, 0.22);
      this.playTone(140, 'square', 0.18, -60, 0.12);
    }

    sfxClick() {
      this.playTone(660, 'sine', 0.08, 120, 0.14);
    }

    sfxVictory() {
      const notes = [440, 554, 659, 880, 1108];
      notes.forEach((n, idx) => {
        setTimeout(() => this.playTone(n, 'triangle', 0.4, 0, 0.2), idx * 110);
      });
    }

    setMusicTrack(track) {
      if (this.currentTrack === track) return;
      this.currentTrack = track;
      this.bgmStep = 0;
      if (this.bgmTimer) clearInterval(this.bgmTimer);

      if (!track) return;

      const tempoMap = {
        'MENU': 260,
        'CINE1': 220,
        'LAKE': 300,
        'WOLF': 145,
        'PINE': 190,
        'VICTORY': 280
      };

      const interval = tempoMap[track] || 250;
      this.bgmTimer = setInterval(() => {
        if (!this.enabled || !this.ctx) return;
        this.stepMusic();
      }, interval);
    }

    stepMusic() {
      this.bgmStep++;
      const s = this.bgmStep;

      if (this.currentTrack === 'MENU') {
        // Acordes suaves de caja de música en Do mayor / Fa mayor
        const arpeggio = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 349.23, 440.00];
        const note = arpeggio[s % arpeggio.length];
        this.playTone(note, 'sine', 0.45, 0, 0.06);
        if (s % 8 === 0) this.playTone(130.81, 'triangle', 0.8, 0, 0.08); // Bajo
      }
      else if (this.currentTrack === 'LAKE') {
        // Ambiente acuático pentatónico relajante
        const penta = [329.63, 392.00, 440.00, 493.88, 587.33, 659.25];
        const note = penta[(s * 3) % penta.length];
        this.playTone(note, 'sine', 0.5, 0, 0.05);
        if (s % 4 === 0) {
          this.playTone(164.81, 'triangle', 0.6, 0, 0.06);
        }
      }
      else if (this.currentTrack === 'WOLF') {
        // Percusión rápida y bajo tenso en La menor
        if (s % 2 === 0) {
          this.playTone(110, 'sawtooth', 0.12, -30, 0.12); // Bajo tenso
        } else {
          this.playNoise(0.06, 800, 0.08); // Percusión tambor
        }
        if (s % 8 === 0) {
          this.playTone(220, 'square', 0.25, -20, 0.09);
        }
      }
      else if (this.currentTrack === 'PINE') {
        // Melodía alegre y saltarina ascendente
        const scale = [293.66, 369.99, 440.00, 554.37, 587.33, 739.99];
        const note = scale[s % scale.length];
        this.playTone(note, 'triangle', 0.3, 0, 0.07);
        if (s % 4 === 0) this.playTone(146.83, 'sine', 0.45, 0, 0.07);
      }
      else if (this.currentTrack === 'VICTORY') {
        const fanfare = [392.00, 493.88, 587.33, 783.99];
        this.playTone(fanfare[s % fanfare.length], 'triangle', 0.4, 0, 0.08);
      }
    }
  }

  const audio = new SoundEngine();

  // ==========================================

  const keys = {

  window.addEventListener('keydown', (e) => {

    if (e.ctrlKey && e.code === 'KeyM') {
      e.preventDefault();

      pendingNextState = null;

      cineFinal.reset();
      currentState = STATE.CINE_FINAL;

    // Pausa con tecla P o Escape en los niveles 1, 2 y 3
    if (e.code === 'KeyP' || (e.code === 'Escape' && (currentState === STATE.LEVEL1 || currentState === STATE.LEVEL2 || currentState === STATE.LEVEL3))) {
      togglePause();
      return;
    }

    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (!keys.jump) keys.jumpPressed = true;
      keys.jump = true;

  // Botones táctiles virtuales
  const setupTouchBtn = (elem, pressAction, releaseAction) => {
    const press = (e) => {
      e.preventDefault();
      audio.init();
      elem.classList.add('active');
      pressAction();
    };
    const release = (e) => {
      e.preventDefault();
      elem.classList.remove('active');
      releaseAction();
    };
    elem.addEventListener('touchstart', press, { passive: false });
    elem.addEventListener('touchend', release, { passive: false });
    elem.addEventListener('mousedown', press);
    elem.addEventListener('mouseup', release);
    elem.addEventListener('mouseleave', release);
  };

  setupTouchBtn(document.getElementById('btn-left'), () => { keys.left = true; }, () => { keys.left = false; });

  // Puntero del ratón para botones de interfaz en Canvas
  let mouse = { x: 0, y: 0, clicked: false, down: false };
  let canvasRect = canvas.getBoundingClientRect();

  function handleResize() {
    canvasRect = canvas.getBoundingClientRect();
  }
  window.addEventListener('resize', handleResize);

  function updateMousePos(clientX, clientY) {
    if (!canvasRect || canvasRect.width === 0) {
      canvasRect = canvas.getBoundingClientRect();
    }
    const scaleX = V_WIDTH / canvasRect.width;
    const scaleY = V_HEIGHT / canvasRect.height;
    mouse.x = (clientX - canvasRect.left) * scaleX;
    mouse.y = (clientY - canvasRect.top) * scaleY;
  }

  window.addEventListener('mousemove', (e) => updateMousePos(e.clientX, e.clientY));
  window.addEventListener('mousedown', (e) => {
    audio.init();
    updateMousePos(e.clientX, e.clientY);
    mouse.down = true;
    mouse.clicked = true;
  });
  window.addEventListener('mouseup', () => { mouse.down = false; });
  window.addEventListener('touchstart', (e) => {
    audio.init();
    if (e.touches.length > 0) {
      updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
      mouse.down = true;
      mouse.clicked = true;
    }
  }, { passive: true });

  // ==========================================
  // 4. SISTEMA DE PARTÍCULAS
  // ==========================================
  class ParticleSystem {
    constructor() {
      this.particles = [];
    }

    add(p) {
      this.particles.push({
        x: p.x || 0,
        y: p.y || 0,
        vx: p.vx || (Math.random() * 2 - 1),
        vy: p.vy || (Math.random() * 2 - 1),
        size: p.size || 4,
        color: p.color || '#fff',
        alpha: p.alpha !== undefined ? p.alpha : 1,
        life: p.life || 60,
        maxLife: p.life || 60,
        type: p.type || 'circle',
        rot: p.rot || Math.random() * Math.PI,
        vRot: p.vRot || (Math.random() * 0.1 - 0.05),
        gravity: p.gravity || 0
      });
    }

    update() {
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rot += p.vRot;
        p.life--;
        p.alpha = Math.max(0, p.life / p.maxLife);
        if (p.life <= 0) {
          this.particles.splice(i, 1);
        }
      }
    }

    draw(ctx, offsetX = 0, offsetY = 0) {
      ctx.save();
      for (const p of this.particles) {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        const px = p.x - offsetX;
        const py = p.y - offsetY;

        if (p.type === 'leaf') {
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(p.rot);
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size * 1.5, p.size * 0.7, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else if (p.type === 'heart') {
          ctx.save();
          ctx.translate(px, py);
          ctx.font = `${p.size * 2}px Fredoka`;
          ctx.textAlign = 'center';
          ctx.fillText('💖', 0, 0);
          ctx.restore();
        } else {
          ctx.beginPath();
          ctx.arc(px, py, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    clear() {
      this.particles = [];
    }
  }

  const particles = new ParticleSystem();

  // Partículas ambientales del bosque (hojas y polen flotante)
  const ambientLeaves = [];
  for (let i = 0; i < 35; i++) {
    ambientLeaves.push({
      x: Math.random() * V_WIDTH,
      y: Math.random() * V_HEIGHT,
      speedX: 0.4 + Math.random() * 0.7,
      speedY: 0.3 + Math.random() * 0.5,
      size: 4 + Math.random() * 4,
      rot: Math.random() * Math.PI * 2,
      color: ['#a8d576', '#f2b55b', '#e28448', '#8ec976'][Math.floor(Math.random() * 4)]
    });
  }

  function updateAndDrawAmbientLeaves(ctx) {
    ctx.save();
    for (const l of ambientLeaves) {
      l.x += l.speedX;
      l.y += l.speedY;
      l.rot += 0.02;
      if (l.x > V_WIDTH + 20) l.x = -20;
      if (l.y > V_HEIGHT + 20) l.y = -20;

      ctx.fillStyle = l.color;
      ctx.globalAlpha = 0.55;
      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.rot);
      ctx.beginPath();
      ctx.ellipse(0, 0, l.size * 1.6, l.size * 0.75, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // --- Dibujar a la Niña (Anika) ---
  function drawGirl(ctx, x, y, options = {}) {
    const scale = options.scale || 1;
    const facing = options.facingRight !== undefined ? (options.facingRight ? 1 : -1) : 1;
    const animState = options.state || 'idle'; // idle, run, jump, fall, cry
    const animTime = options.animTime || 0;
    const hasDuck = options.hasDuck || false;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale * facing, scale);

    // Rebote sutil en idle y run
    let bobY = 0;
    let legL = 0;
    let legR = 0;
    let capeAngle = 0;

    if (animState === 'idle') {
      bobY = Math.sin(animTime * 4) * 2;
      capeAngle = Math.sin(animTime * 3) * 0.05;
    } else if (animState === 'run') {
      bobY = Math.abs(Math.sin(animTime * 12)) * 4;
      legL = Math.sin(animTime * 12) * 12;
      legR = -legL;
      capeAngle = 0.28 + Math.sin(animTime * 12) * 0.15;
    } else if (animState === 'jump') {
      bobY = -2;
      legL = -8;
      legR = -4;
      capeAngle = 0.45;
    } else if (animState === 'fall') {
      bobY = 1;
      legL = 4;
      legR = 7;
      capeAngle = -0.3;
    }

    // Sombra en el suelo
    ctx.save();
    ctx.fillStyle = 'rgba(20, 25, 30, 0.22)';
    ctx.beginPath();
    ctx.ellipse(0, 2, 16, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Piernas / Botitas marrones
    ctx.fillStyle = '#6d4834';
    // Pierna izquierda
    ctx.beginPath();
    ctx.roundRect(-7 + legL * 0.3, -12 - bobY, 6, 12, 3);
    ctx.fill();
    // Pierna derecha
    ctx.beginPath();
    ctx.roundRect(1 + legR * 0.3, -12 - bobY, 6, 12, 3);
    ctx.fill();

    // Vestido azul/verde pastel
    ctx.fillStyle = '#4c8c82';
    ctx.beginPath();
    ctx.moveTo(-11, -12 - bobY);
    ctx.lineTo(11, -12 - bobY);
    ctx.lineTo(8, -28 - bobY);
    ctx.lineTo(-8, -28 - bobY);
    ctx.closePath();
    ctx.fill();

    // Capa roja cálida (flameando)
    ctx.save();
    ctx.translate(-4, -28 - bobY);
    ctx.rotate(capeAngle);
    ctx.fillStyle = '#dc5847';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-18, 10, -14, 24);
    ctx.quadraticCurveTo(-4, 20, 4, 16);
    ctx.lineTo(4, 0);
    ctx.closePath();
    ctx.fill();
    // Borde blanco de la capa
    ctx.strokeStyle = '#fff8e8';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();

    // Cabeza de la niña (redondita y tierna)
    const headY = -37 - bobY;

    // Cabello detrás
    ctx.fillStyle = '#5a3825';
    ctx.beginPath();
    ctx.arc(0, headY, 15, 0, Math.PI * 2);
    ctx.fill();

    // Coleta simpática
    ctx.beginPath();
    ctx.arc(-13, headY + 3, 7, 0, Math.PI * 2);
    ctx.fill();

    // Rostro color piel cálido
    ctx.fillStyle = '#fedec4';
    ctx.beginPath();
    ctx.arc(1, headY + 1, 12, 0, Math.PI * 2);
    ctx.fill();

    // Flequillo redondo
    ctx.fillStyle = '#5a3825';
    ctx.beginPath();
    ctx.arc(1, headY - 4, 12, Math.PI * 0.9, Math.PI * 2.1);
    ctx.fill();

    // Mejillas sonrosadas
    ctx.fillStyle = 'rgba(255, 130, 130, 0.55)';
    ctx.beginPath();
    ctx.arc(5, headY + 4, 3.2, 0, Math.PI * 2);
    ctx.arc(-2, headY + 4, 2.8, 0, Math.PI * 2);
    ctx.fill();

    // Ojos tiernos con brillo
    ctx.fillStyle = '#221e25';
    if (animState === 'cry') {
      // Ojos llorosos / cerrados de pena
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#221e25';
      ctx.beginPath();
      ctx.arc(5, headY + 1, 3, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      // Lágrima
      ctx.fillStyle = '#6bc5f8';
      ctx.beginPath();
      ctx.arc(7, headY + 6, 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(5, headY + 1, 2.5, 0, Math.PI * 2);
      ctx.fill();
      // Brillo blanco
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(5.8, headY + 0.3, 1, 0, Math.PI * 2);
      ctx.fill();
    }

    // Boquita tierna
    ctx.strokeStyle = '#8a4b44';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (animState === 'cry') {
      ctx.arc(4, headY + 7, 2, Math.PI * 1.1, Math.PI * 1.9); // Triste
    } else if (animState === 'run' || animState === 'jump') {
      ctx.arc(4, headY + 5, 2.2, 0, Math.PI); // Sonrisa abierta
    } else {
      ctx.arc(4, headY + 5, 1.8, 0.1, Math.PI * 0.9);
    }
    ctx.stroke();

    // Capucha / lazo rojo en la cabeza
    ctx.fillStyle = '#dc5847';
    ctx.beginPath();
    ctx.arc(-2, headY - 8, 5, 0, Math.PI * 2);
    ctx.fill();

    // Peluche de pato en brazos (si lo tiene)
    if (hasDuck) {
      drawDuckPlush(ctx, 6, -20 - bobY, 0.85);
    }

    ctx.restore();
  }

  // --- Dibujar el Patito de Peluche ---
  function drawDuckPlush(ctx, x, y, scale = 1, rotation = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.scale(scale, scale);

    // Cuerpo amarillo suave

    ctx.beginPath();
    ctx.ellipse(0, 0, 11, 8.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cabeza
    ctx.beginPath();
    ctx.arc(7, -6, 7.5, 0, Math.PI * 2);
    ctx.fill();

    // Pico naranja tierno
    ctx.fillStyle = '#ff8324';
    ctx.beginPath();
    ctx.moveTo(13, -7);
    ctx.lineTo(20, -5);
    ctx.lineTo(13, -3);
    ctx.closePath();
    ctx.fill();

    // Ojo de botón negro con brillo
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(9, -7, 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(9.5, -7.5, 0.6, 0, Math.PI * 2);
    ctx.fill();

    // Ala pequeña con costura
    ctx.fillStyle = '#f5c026';
    ctx.beginPath();
    ctx.ellipse(-2, -1, 5.5, 3.8, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Cola respingona
    ctx.fillStyle = '#ffd13b';
    ctx.beginPath();
    ctx.moveTo(-9, -2);
    ctx.lineTo(-15, -6);
    ctx.lineTo(-9, 3);
    ctx.closePath();
    ctx.fill();

  }

  // --- Dibujar el Águila ---
  function drawEagle(ctx, x, y, scale = 1, wingPhase = 0, carryingDuck = false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    const wingSpan = Math.sin(wingPhase) * 28;

    // Sombra del águila
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';

    ctx.ellipse(0, 110, 35, 12, 0, 0, Math.PI * 2);

    // Ala trasera
    ctx.fillStyle = '#4a3728';
    ctx.beginPath();
    ctx.moveTo(-15, -10);
    ctx.quadraticCurveTo(-35, -45 - wingSpan, -70, -20 - wingSpan * 0.8);
    ctx.quadraticCurveTo(-45, -5, -20, 5);
    ctx.closePath();
    ctx.fill();

    // Plumas del ala trasera
    ctx.fillStyle = '#3a2b1f';
    ctx.beginPath();
    ctx.moveTo(-45, -5);
    ctx.lineTo(-70, -20 - wingSpan * 0.8);
    ctx.lineTo(-60, -5 - wingSpan * 0.4);
    ctx.closePath();
    ctx.fill();

    // Cola emplumada
    ctx.fillStyle = '#ece4d8';
    ctx.beginPath();
    ctx.moveTo(-30, 2);
    ctx.lineTo(-58, 12);
    ctx.lineTo(-34, 14);
    ctx.closePath();
    ctx.fill();

    // Cuerpo robusto
    ctx.fillStyle = '#5c4432';
    ctx.beginPath();
    ctx.ellipse(-10, 0, 28, 17, -0.2, 0, Math.PI * 2);
    ctx.fill();

    // Pecho moteado
    ctx.fillStyle = '#e8d8c2';
    ctx.beginPath();
    ctx.ellipse(-4, 3, 14, 11, -0.2, 0, Math.PI * 2);
    ctx.fill();

    // Cabeza blanca majestuosa
    ctx.fillStyle = '#f8f5ee';
    ctx.beginPath();
    ctx.arc(22, -10, 14, 0, Math.PI * 2);
    ctx.fill();

    // Ojo ámbar penetrante
    ctx.fillStyle = '#e8a317';
    ctx.beginPath();
    ctx.arc(26, -13, 3.2, 0, Math.PI * 2);

    ctx.fillStyle = '#111';

    ctx.arc(27, -13, 1.8, 0, Math.PI * 2);

    // Pico curvado dorado
    ctx.fillStyle = '#f5a623';

    ctx.moveTo(33, -15);
    ctx.quadraticCurveTo(46, -10, 42, 3);
    ctx.quadraticCurveTo(34, -2, 32, -4);
    ctx.closePath();
    ctx.fill();

    // Ala delantera
    ctx.fillStyle = '#6e523c';
    ctx.beginPath();
    ctx.moveTo(0, -6);

    ctx.quadraticCurveTo(25, -2, -5, 8);

    // Garras doradas
    ctx.fillStyle = '#f5a623';

    // Si lleva el patito atrapado

  // --- Dibujar el Lobo Feroz (Figura articulada sólida y estilizada) ---
  function drawWolf(ctx, x, y, scale = 1, runTime = 0, mouthOpen = false, isJumping = false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Oscilación vertical suave del cuerpo durante la carrera (en salto se estabiliza)
    const bodyBob = isJumping ? -6 : Math.abs(Math.sin(runTime * 14)) * 4;

    // Sombra del lobo en el suelo
    ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
    ctx.beginPath();
    ctx.ellipse(0, 4, 38, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Puntos de pivote articulares FIJOS al cuerpo del lobo
    const hipX = -18;
    const hipY = -18 - bodyBob;
    const shoulderX = 16;
    const shoulderY = -18 - bodyBob;

    // Ángulos de las patas
    let rearAngleFondo, frontAngleFondo, rearAngleFrente, frontAngleFrente;
    if (isJumping) {
      // Pose de salto estilizada: patas delanteras extendidas hacia adelante, traseras hacia atrás
      frontAngleFrente = 0.45;
      frontAngleFondo = 0.35;
      rearAngleFrente = -0.55;
      rearAngleFondo = -0.45;
    } else {
      // Animación de carrera articulada: rotan alrededor de sus pivotes fijos
      const swing = Math.sin(runTime * 14) * 0.52;
      frontAngleFrente = swing;
      rearAngleFrente = -swing;
      frontAngleFondo = -swing * 0.85;
      rearAngleFondo = swing * 0.85;
    }

    // Función auxiliar para dibujar una pata articulada con solape en el torso
    function renderLeg(jointX, jointY, angle, legColor, pawColor) {
      ctx.save();
      ctx.translate(jointX, jointY);
      ctx.rotate(angle);

      // Muslo / pierna (inicia solapando 5px arriba del pivote para evitar huecos)
      ctx.fillStyle = legColor;
      ctx.beginPath();
      ctx.roundRect(-4.5, -5, 9, 26, 4);
      ctx.fill();

      // Zarpa / pata inferior redondeada
      ctx.fillStyle = pawColor;
      ctx.beginPath();
      ctx.roundRect(-5.5, 16, 11, 7, 3);
      ctx.fill();

      ctx.restore();
    }

    // 1. Patas del lado lejano (fondo)
    renderLeg(hipX - 3, hipY, rearAngleFondo, '#2a2c33', '#1e2026');
    renderLeg(shoulderX - 3, shoulderY, frontAngleFondo, '#2a2c33', '#1e2026');

    // 2. Cola esponjosa (anclada fijamente a la parte trasera del torso)
    const tailTailWiggle = isJumping ? -0.2 : Math.sin(runTime * 14) * 0.2;
    ctx.fillStyle = '#3a3d47';
    ctx.beginPath();
    ctx.moveTo(hipX - 10, hipY - 2);
    ctx.quadraticCurveTo(-55, -28 - bodyBob + tailTailWiggle * 18, -48, -8 - bodyBob);
    ctx.quadraticCurveTo(-38, -2 - bodyBob, hipX - 5, hipY + 8);
    ctx.closePath();
    ctx.fill();

    // 3. Torso / Cuerpo atlético (elipse central con solape total sobre las patas)
    ctx.fillStyle = '#444854';
    ctx.beginPath();
    ctx.ellipse(-2, -22 - bodyBob, 32, 17, -0.08, 0, Math.PI * 2);
    ctx.fill();

    // Pecho fuerte y melena dorsal con púas estilizadas
    ctx.fillStyle = '#2c2f38';
    ctx.beginPath();
    ctx.moveTo(shoulderX - 4, -36 - bodyBob);
    ctx.lineTo(shoulderX - 14, -42 - bodyBob);
    ctx.lineTo(shoulderX - 10, -32 - bodyBob);
    ctx.lineTo(shoulderX - 22, -38 - bodyBob);
    ctx.lineTo(shoulderX - 20, -26 - bodyBob);
    ctx.closePath();
    ctx.fill();

    // 4. Patas del lado cercano (frente)
    renderLeg(hipX, hipY, rearAngleFrente, '#4d525f', '#363942');
    renderLeg(shoulderX, shoulderY, frontAngleFrente, '#4d525f', '#363942');

    // 5. Cabeza del lobo (anclada fijamente al frente del torso)
    const headX = 26;
    const headY = -30 - bodyBob;

    ctx.fillStyle = '#444854';
    ctx.beginPath();
    ctx.arc(headX, headY, 15, 0, Math.PI * 2);
    ctx.fill();

    // Orejas puntiagudas alertas
    ctx.fillStyle = '#2c2f38';
    ctx.beginPath();
    ctx.moveTo(headX - 6, headY - 12);
    ctx.lineTo(headX - 2, headY - 26);
    ctx.lineTo(headX + 6, headY - 12);
    ctx.closePath();
    ctx.fill();

    // Interior de la oreja
    ctx.fillStyle = '#5c4146';
    ctx.beginPath();
    ctx.moveTo(headX - 4, headY - 13);
    ctx.lineTo(headX - 2, headY - 22);
    ctx.lineTo(headX + 4, headY - 13);
    ctx.closePath();
    ctx.fill();

    // Hocico largo
    ctx.fillStyle = '#3a3d47';
    ctx.beginPath();
    ctx.moveTo(headX + 8, headY - 6);
    ctx.lineTo(headX + 28, headY - 2);
    ctx.lineTo(headX + 8, headY + 8);
    ctx.closePath();
    ctx.fill();

    // Trufa / Nariz negra
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(headX + 28, headY - 2, 3, 0, Math.PI * 2);
    ctx.fill();

    // Mandíbula y colmillos
    if (mouthOpen) {
      ctx.fillStyle = '#8a2b2b';
      ctx.beginPath();
      ctx.moveTo(headX + 10, headY + 2);
      ctx.lineTo(headX + 24, headY + 5);
      ctx.lineTo(headX + 12, headY + 12);
      ctx.closePath();
      ctx.fill();
      // Colmillos blancos
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(headX + 15, headY + 2);
      ctx.lineTo(headX + 17, headY + 7);
      ctx.lineTo(headX + 19, headY + 2);
      ctx.fill();
    }

    // Ojo ámbar brillante
    ctx.fillStyle = '#ffb300';
    ctx.beginPath();
    ctx.arc(headX + 8, headY - 5, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(headX + 9, headY - 5, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // --- Fondos y Paisajes ---

  // --- Fondos y Paisajes Continuos con Optimización Offscreen ---

  // Cielo con gradiente pre-renderizado (cubre 100% de la pantalla)
  function drawSky(ctx, type = 'day') {
    if (type === 'day' && offscreen.skyDay) {
      ctx.drawImage(offscreen.skyDay, 0, 0);
    } else if (type === 'sunset' && offscreen.skySunset) {
      ctx.drawImage(offscreen.skySunset, 0, 0);
    } else if (type === 'twilight' && offscreen.skyTwilight) {
      ctx.drawImage(offscreen.skyTwilight, 0, 0);
    } else {
      ctx.fillStyle = type === 'sunset' ? '#533b68' : (type === 'twilight' ? '#1d1936' : '#78c6e8');
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
    }
  }

  // Montañas lejanas con capas suaves y tileado continuo (sin cortes ni trabas)
  function drawMountains(ctx, scrollX = 0, color1 = '#9fc0b5', color2 = '#7da397') {
    drawParallaxMountains(ctx, scrollX, color1, color2);
  }

  function drawParallaxMountains(ctx, scrollX = 0, color1 = '#9fc0b5', color2 = '#7da397') {
    const img = (color1 === '#78435d') ? offscreen.mountainsSunset : offscreen.mountainsDay;
    drawParallaxLayer(ctx, img, scrollX, 1.0);
  }

  function drawParallaxLakeHills(ctx, scrollX = 0) {
    drawParallaxLayer(ctx, offscreen.hillsLake, scrollX, 1.0);
  }

  // Árboles redondeados estilo cuento de hadas apoyados exactamente en el terreno
  function drawStoryTree(ctx, x, y, scale = 1, foliageColor = '#5fa867', trunkColor = '#80593f') {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Tronco sinuoso firmemente enraizado en el suelo (y = 0)
    ctx.fillStyle = trunkColor;
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.quadraticCurveTo(-17, 3, -20, 4);
    ctx.lineTo(-13, 0);
    ctx.quadraticCurveTo(-6, -50, -4, -90);
    ctx.lineTo(4, -90);
    ctx.quadraticCurveTo(6, -50, 13, 0);
    ctx.quadraticCurveTo(17, 3, 20, 4);
    ctx.lineTo(14, 0);
    ctx.closePath();
    ctx.fill();

    // Briznas de pasto decorativas en la base del tronco
    ctx.fillStyle = '#559c47';
    ctx.beginPath();
    ctx.arc(-16, 0, 4, Math.PI, 0);
    ctx.arc(16, 0, 4, Math.PI, 0);
    ctx.fill();

    // Copa esponjosa en círculos
    ctx.fillStyle = foliageColor;
    ctx.beginPath();
    ctx.arc(0, -110, 42, 0, Math.PI * 2);
    ctx.arc(-26, -95, 32, 0, Math.PI * 2);
    ctx.arc(26, -95, 32, 0, Math.PI * 2);
    ctx.arc(-16, -130, 28, 0, Math.PI * 2);
    ctx.arc(16, -130, 28, 0, Math.PI * 2);
    ctx.fill();

    // Brillo suave en la copa
    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.beginPath();
    ctx.arc(-10, -118, 22, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Marco adaptable dinámicamente al texto (sin desbordamiento, centrado y con padding uniforme)
  function drawInstructionBox(ctx, text, x = 24, y = 20, maxW = 560) {
    ctx.save();
    ctx.font = '600 18px Fredoka, Quicksand, sans-serif';

    const words = text.split(' ');
    const lines = [];
    let curLine = words[0];

    for (let i = 1; i < words.length; i++) {
      const testLine = curLine + ' ' + words[i];
      if (ctx.measureText(testLine).width > maxW - 32) {
        lines.push(curLine);
        curLine = words[i];
      } else {
        curLine = testLine;
      }
    }
    lines.push(curLine);

    const padX = 16;
    const padY = 12;
    const lineHeight = 24;

    let maxTextW = 0;
    for (const line of lines) {
      const w = ctx.measureText(line).width;
      if (w > maxTextW) maxTextW = w;
    }

    const boxW = Math.ceil(maxTextW + padX * 2);
    const boxH = Math.ceil(lines.length * lineHeight + padY * 2 - 4);

    // Fondo redondeado con sombra y borde suave
    ctx.fillStyle = 'rgba(20, 24, 32, 0.72)';
    ctx.beginPath();
    ctx.roundRect(x, y, boxW, boxH, 14);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // Texto perfectamente alineado vertical y horizontalmente
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    lines.forEach((line, idx) => {
      ctx.fillText(line, x + padX, y + padY + idx * lineHeight);
    });

    ctx.restore();
  }

  // Dibuja corazones de vidas en el HUD
  // cx = centro X, cy = Y de la fila de corazones
  function drawHearts(ctx, currentLives, maxLives, cx, cy) {
    ctx.save();
    const heartW = 26;
    const gap = 6;
    const totalW = maxLives * heartW + (maxLives - 1) * gap + 20;
    const boxX = cx - totalW / 2;
    const boxH = 32;

    // Fondo pastilla
    ctx.fillStyle = 'rgba(20, 24, 32, 0.70)';
    ctx.beginPath();
    ctx.roundRect(boxX, cy, totalW, boxH, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.font = '20px Fredoka';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < maxLives; i++) {
      const hx = boxX + 10 + i * (heartW + gap) + heartW / 2;
      const hy = cy + boxH / 2;
      ctx.globalAlpha = i < currentLives ? 1 : 0.25;
      ctx.fillText('❤️', hx, hy);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
