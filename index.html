    update() {
      this.timer += 1 / 60;

      // Saltar cinemática con tecla Espacio o Escape
      if (keys.jumpPressed || keys.esc) {
        keys.jumpPressed = false;
        keys.esc = false;
        switchState(STATE.VICTORY);
        return;
      }

      // Sonido de patito al abrazarlo.
      if (this.timer > FINAL_CINEMATIC.nest * 0.62 && duckInNest) {
        duckInNest = false;
        audio.sfxDuck();
      }

      // Descenso de cámara lineal, sin rebote ni sobrepaso.
      const descentStart = FINAL_CINEMATIC.nest;
      const descentProgress = Math.max(0, Math.min(1, (this.timer - descentStart) / FINAL_CINEMATIC.descent));
      this.cameraY = -175 + descentProgress * 790;

      // Solo cuatro corazones en instantes definidos, lejos de la cara.
      if (FINAL_HEART_TIMES.some(time => Math.abs(this.timer - time) < 1 / 60)) {
        particles.add({
          x: 790 + (FINAL_HEART_TIMES.findIndex(time => Math.abs(this.timer - time) < 1 / 60) - 1.5) * 28,
          y: 265,
          vx: 0,
          vy: -0.9,
          size: 9,
          type: 'heart',
          life: 52
        });
      }

      if (this.timer > FINAL_CINEMATIC.total) {
        switchState(STATE.VICTORY);
      }
    },

    draw(ctx) {
      const t = this.timer;
      this.buildAssets();
      const nestEnd = FINAL_CINEMATIC.nest;
      const descentEnd = nestEnd + FINAL_CINEMATIC.descent;
      const homeEnd = descentEnd + FINAL_CINEMATIC.home;
      const isTop = t < nestEnd;
      const isDescent = t >= nestEnd && t < descentEnd;
      const isHome = t >= descentEnd;

      if (isTop) {
        const progress = Math.min(1, t / nestEnd);
        const zoom = 1 + progress * 0.12;
        const walk = Math.min(1, t / (nestEnd * 0.38));
        const targetX = this.nestX - 92;
        const girlX = this.startX + (targetX - this.startX) * walk;
        const hug = Math.max(0, Math.min(1, (t - nestEnd * 0.48) / 0.5));

        ctx.save();
        ctx.translate(V_WIDTH / 2, V_HEIGHT / 2);
        ctx.scale(zoom, zoom);
        ctx.translate(-V_WIDTH / 2, -V_HEIGHT / 2);
        ctx.drawImage(this.assets.top, 0, 0);
        const nestImage = duckInNest ? this.assets.nestWithDuck : this.assets.nestEmpty;
        ctx.drawImage(nestImage, this.nestX - nestImage.width / 2, this.nestY - 48);
        // Sutil movimiento de nubes en primer plano.
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = '#fff1dc';
        for (let i = 0; i < 3; i++) {
          const x = ((i * 510 + stateTime * 7) % (V_WIDTH + 160)) - 80;
          ctx.beginPath(); ctx.ellipse(x, 120 + i * 46, 68, 14, 0, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;

        // A la izquierda de la copa, en su propia rama y sin tapar el nido.
        // Coordenada vertical es la línea superior de la rama: los pies nunca se separan de ella.
        drawGirl(ctx, girlX, this.topBranchY, {
          scale: 1.82,
          facingRight: true,
          state: t < nestEnd * 0.38 ? 'run' : 'idle',
          animTime: stateTime + hug * 0.45,
          hasDuck: !duckInNest
        });
        // Gesto de abrazo representado por un pequeño balanceo y destellos cálidos.
        if (!duckInNest) {
          ctx.strokeStyle = 'rgba(255, 227, 160, 0.75)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(girlX + 9, 311, 16 + Math.sin(stateTime * 3) * 1.5, 0.12, Math.PI * 0.9); ctx.stroke();
        }
        ctx.restore();

        // Marco breve para el texto narrativo, siempre dentro del canvas.
        ctx.fillStyle = 'rgba(49, 34, 52, 0.68)';
        ctx.beginPath(); ctx.roundRect(250, 30, 780, 64, 20); ctx.fill();
        ctx.strokeStyle = 'rgba(255, 232, 188, 0.8)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff6e8'; ctx.font = '600 24px Fredoka'; ctx.textAlign = 'center';
        ctx.fillText(!duckInNest ? '¡Anika abraza feliz a su patito!' : '¡El nido está justo en la cima del pino!', V_WIDTH / 2, 70, 730);
      } else if (isDescent) {
        const progress = Math.max(0, Math.min(1, (t - nestEnd) / FINAL_CINEMATIC.descent));
        const cameraY = -70 + progress * 805;
        const segment = progress * (this.descentBranches.length - 1);
        const branchIndex = Math.min(this.descentBranches.length - 2, Math.floor(segment));
        const local = segment - branchIndex;
        const from = this.descentBranches[branchIndex];
        const to = this.descentBranches[branchIndex + 1];
        const arc = Math.sin(local * Math.PI) * 38;
        const girlX = from.x + (to.x - from.x) * local;
        const girlY = from.y + (to.y - from.y) * local - arc;

        ctx.drawImage(this.assets.descent, 0, 0);
        ctx.save();
        ctx.translate(0, -cameraY);
        // Profundidad del tronco central.
        ctx.fillStyle = '#64432f';
        ctx.beginPath(); ctx.moveTo(552, -200); ctx.lineTo(590, 1280); ctx.quadraticCurveTo(640, 1320, 690, 1280);
        ctx.lineTo(728, -200); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(211, 159, 108, 0.42)'; ctx.lineWidth = 5;
        for (let y = -100; y < 1280; y += 75) {
          ctx.beginPath(); ctx.moveTo(578, y); ctx.quadraticCurveTo(640, y + 19, 701, y - 2); ctx.stroke();
        }
        for (const branch of this.descentBranches) level3.drawBranch(ctx, branch);

        // Trayectoria en arcos cortos: preparación, salto y aterrizaje en cada rama.
        const jumpPhase = local < 0.16 ? 'idle' : local > 0.84 ? 'idle' : 'jump';
        drawGirl(ctx, girlX, girlY, {
          scale: 1.72,
          facingRight: to.x >= from.x,
          state: jumpPhase,
          animTime: stateTime + local * 0.5,
          hasDuck: true
        });
        // Hojas y destellos escasos que caen junto al tronco.
        for (let i = 0; i < 7; i++) {
          const leafY = ((i * 193 + stateTime * (24 + i)) % 1350);
          const leafX = 215 + ((i * 173 + Math.sin(stateTime + i) * 22) % 850);
          ctx.fillStyle = i % 2 ? 'rgba(255, 216, 151, 0.72)' : 'rgba(167, 205, 151, 0.75)';
          ctx.beginPath(); ctx.ellipse(leafX, leafY, 4, 7, Math.sin(stateTime + i), 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
        ctx.fillStyle = `rgba(255, 201, 125, ${progress * 0.12})`;
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        ctx.fillStyle = 'rgba(49, 34, 52, 0.62)';
        ctx.beginPath(); ctx.roundRect(270, 30, 740, 58, 18); ctx.fill();
        ctx.fillStyle = '#fff6e8'; ctx.font = '600 23px Fredoka'; ctx.textAlign = 'center';
        ctx.fillText('Con su patito, Anika baja rama por rama...', V_WIDTH / 2, 67, 700);
      } else if (isHome) {
        const homeProgress = Math.max(0, Math.min(1, (t - descentEnd) / FINAL_CINEMATIC.home));
        drawSky(ctx, 'sunset');
        ctx.drawImage(this.assets.home, 0, 0);
        updateAndDrawAmbientLeaves(ctx);
        // Sendero en perspectiva: ancho abajo y estrecho hasta el umbral de la puerta.
        ctx.fillStyle = 'rgba(221, 174, 117, 0.75)';
        ctx.beginPath(); ctx.moveTo(460, V_HEIGHT); ctx.quadraticCurveTo(670, 580, 958, 475);
        ctx.lineTo(996, 475); ctx.quadraticCurveTo(790, 595, 720, V_HEIGHT); ctx.closePath(); ctx.fill();
        // Casa y valla van por delante del camino, sin cubrir pared ni tejado.
        ctx.drawImage(this.assets.homeHouse, 0, 0);
        const walk = Math.min(1, homeProgress / 0.78);
        const girlX = 220 + walk * 390;
        drawGirl(ctx, girlX, 550, {
          scale: 1.75,
          facingRight: true,
          state: walk < 1 ? 'run' : 'idle',
          animTime: stateTime,
          hasDuck: true
        });
        ctx.fillStyle = 'rgba(48, 37, 48, 0.62)';
        ctx.beginPath(); ctx.roundRect(245, 30, 790, 58, 18); ctx.fill();
        ctx.fillStyle = '#fff6e8'; ctx.font = '600 23px Fredoka'; ctx.textAlign = 'center';
        ctx.fillText('¡A casa, juntos, bajo el cielo dorado!', V_WIDTH / 2, 67, 750);

        const fade = Math.max(0, Math.min(1, (t - homeEnd) / FINAL_CINEMATIC.fade));
        if (fade > 0) {
          ctx.fillStyle = `rgba(18, 14, 24, ${fade})`;
          ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        }
      }

      // Partículas
      particles.draw(ctx, 0, 0);

      // Botón SALTAR CINEMÁTICA
      const btnSkipHover = isMouseInBox(V_WIDTH - 120, V_HEIGHT - 42, 180, 42);
      drawButton(ctx, V_WIDTH - 120, V_HEIGHT - 42, 180, 42, 'SALTAR ▶', btnSkipHover);
      if (mouse.clicked && btnSkipHover) {
        mouse.clicked = false;
        audio.sfxClick();
        switchState(STATE.VICTORY);
      }
    }
  };

  // Pantalla de Victoria / Fin
  function drawVictoryScreen(ctx) {
    drawSky(ctx, 'sunset');
    updateAndDrawAmbientLeaves(ctx);

    // Tarjeta elegante de fin de juego
    ctx.save();
    ctx.translate(V_WIDTH / 2, V_HEIGHT / 2);

    ctx.fillStyle = 'rgba(25, 20, 32, 0.78)';
    ctx.beginPath();
    ctx.roundRect(-280, -210, 560, 420, 24);
    ctx.fill();

    ctx.strokeStyle = '#ffc857';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Título de FIN
    ctx.fillStyle = '#ffd166';
    ctx.font = '700 52px Fredoka';
    ctx.textAlign = 'center';
    ctx.fillText('FIN', 0, -130);

    // Ilustración tierna
    drawGirl(ctx, 0, 10, {
      scale: 2.0,
      facingRight: true,
      state: 'idle',
      animTime: stateTime,
      hasDuck: true
    });

    ctx.fillStyle = '#ffffff';
    ctx.font = '500 22px Fredoka';
    ctx.fillText('Anika y su patito han regresado sanos y salvos a casa.', 0, 75);

    // Botón para volver al inicio
    const btnHover = isMouseInBox(V_WIDTH / 2, V_HEIGHT / 2 + 145, 280, 54);
    drawButton(ctx, 0, 145, 280, 54, 'VOLVER AL INICIO', btnHover, '🏠');

    if (mouse.clicked && btnHover) {
      mouse.clicked = false;
      audio.sfxClick();
      switchState(STATE.MENU);
    }

    ctx.restore();
  }

  // ==========================================
  // 12. PANTALLAS DE MENÚ Y CRÉDITOS
  // ==========================================
  function drawMenuScreen(ctx) {
    // 1. Fondo cielo y montañas continuas (tileado)
    drawSky(ctx, 'day');
    drawParallaxMountains(ctx, stateTime * 14, '#9fc0b5', '#7da397');

    // 2. Águila en la pantalla de inicio: Vuela SIEMPRE en el cielo, en el tercio superior (Y: 95-135)
    // Por encima de los árboles y del horizonte, nunca cruza el suelo (y = 530)
    const eagleCycle = ((stateTime * 95) % (V_WIDTH + 340)) - 170;
    const eagleAltitude = 115 + Math.sin(stateTime * 1.8) * 18;
    drawEagle(ctx, eagleCycle, eagleAltitude, 1.1, stateTime * 9, false);

    // 3. Árboles apoyados exactamente en la línea del suelo (y = 530)
    for (let i = 0; i < 9; i++) {
      drawStoryTree(ctx, 70 + i * 165, 530, 1.0, '#5fa867', '#6b4934');
    }

    // 4. Suelo verde con capa de tierra cubriendo 100% de la base
    ctx.fillStyle = '#65a854';
    ctx.fillRect(0, 530, V_WIDTH, V_HEIGHT - 530);
    ctx.fillStyle = '#7a553c';
    ctx.fillRect(0, 545, V_WIDTH, V_HEIGHT - 545);

    // Hojas cayendo suavemente
    updateAndDrawAmbientLeaves(ctx);

    // Niña jugando con su pato en el menú
    drawGirl(ctx, 320, 530, {
      scale: 1.8,
      facingRight: true,
      state: 'idle',
      animTime: stateTime,
      hasDuck: true
    });

    // Título estilizado estilo libro de cuentos
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
    ctx.shadowOffsetY = 4;
    ctx.shadowBlur = 8;

    ctx.fillStyle = '#ffffff';
    ctx.font = '700 68px Fredoka';
    ctx.textAlign = 'center';
    ctx.fillText('EL VIAJE DE ANIKA', V_WIDTH / 2 + 80, 170);

    ctx.fillStyle = '#fce295';
    ctx.font = '600 26px Fredoka';
    ctx.fillText('Una tierna odisea por el bosque', V_WIDTH / 2 + 80, 220);
    ctx.restore();

    // 1. Botón INICIAR (Comienza la historia desde la cinemática inicial)
    const btnPlayHover = isMouseInBox(V_WIDTH / 2 + 80, 285, 260, 52);
    drawButton(ctx, V_WIDTH / 2 + 80, 285, 260, 52, 'INICIO', btnPlayHover, '▶');
    if (mouse.clicked && btnPlayHover) {
      mouse.clicked = false;
      audio.sfxClick();
      cine1.reset();
      switchState(STATE.CINE1);
      return;
    }

    // 2. Botón NIVELES (Selector de niveles directo)
    const btnLevelsHover = isMouseInBox(V_WIDTH / 2 + 80, 350, 260, 52);
    drawButton(ctx, V_WIDTH / 2 + 80, 350, 260, 52, 'NIVELES', btnLevelsHover, '⭐');
    if (mouse.clicked && btnLevelsHover) {
      mouse.clicked = false;
      audio.sfxClick();
      switchState(STATE.LEVEL_SELECT);
      return;
    }

    // 3. Botón CRÉDITOS
    const btnCredHover = isMouseInBox(V_WIDTH / 2 + 80, 415, 260, 52);
    drawButton(ctx, V_WIDTH / 2 + 80, 415, 260, 52, 'CRÉDITOS', btnCredHover, '📜');
    if (mouse.clicked && btnCredHover) {
      mouse.clicked = false;
      audio.sfxClick();
      switchState(STATE.CREDITS);
      return;
    }
  }

  // ==========================================
  // PANTALLA: SELECTOR DE NIVELES (1, 2 y 3)
  // ==========================================
  function drawLevelSelectScreen(ctx) {
    drawSky(ctx, 'day');
    drawParallaxMountains(ctx, stateTime * 14, '#9fc0b5', '#7da397');
    updateAndDrawAmbientLeaves(ctx);

    ctx.save();
    ctx.translate(V_WIDTH / 2, V_HEIGHT / 2);

    // Marco estilo libro de cuentos
    const modalW = 760;
    const modalH = 460;
    ctx.fillStyle = 'rgba(28, 22, 36, 0.92)';
    ctx.beginPath();
    ctx.roundRect(-modalW / 2, -modalH / 2, modalW, modalH, 26);
    ctx.fill();

    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Título y subtítulo
    ctx.fillStyle = '#ffd166';
    ctx.font = '700 40px Fredoka';
    ctx.textAlign = 'center';
    ctx.fillText('SELECCIONAR NIVEL', 0, -165);

    ctx.fillStyle = '#ffeedb';
    ctx.font = '500 20px Fredoka';
    ctx.fillText('Elige una aventura para jugar con vidas completas:', 0, -125);

    // 3 Tarjetas grandes y redondeadas con los números 1, 2 y 3
    const levelsData = [
      { id: 1, name: 'El Lago', icon: '💧', desc: 'Cruza las piedras', state: STATE.LEVEL1, init: () => level1.init() },
      { id: 2, name: 'El Lobo', icon: '🐺', desc: 'Salta los troncos', state: STATE.LEVEL2, init: () => level2.init() },
      { id: 3, name: 'El Gran Pino', icon: '🌲', desc: 'Escala al nido', state: STATE.LEVEL3, init: () => level3.init() }
    ];

    const cardW = 200;
    const cardH = 210;
    const startX = -230;
    const spacingX = 230;
    const cardY = 5;

    levelsData.forEach((lvl, idx) => {
      const cx = startX + idx * spacingX;
      const cy = cardY;
      const hover = isMouseInBox(V_WIDTH / 2 + cx, V_HEIGHT / 2 + cy, cardW, cardH);

      ctx.save();
      ctx.translate(cx, cy);

      // Fondo tarjeta con efecto hover
      ctx.fillStyle = hover ? 'rgba(75, 55, 95, 0.95)' : 'rgba(44, 34, 58, 0.88)';
      ctx.beginPath();
      ctx.roundRect(-cardW / 2, -cardH / 2, cardW, cardH, 20);
      ctx.fill();

      ctx.strokeStyle = hover ? '#ffd166' : 'rgba(255, 209, 102, 0.45)';
      ctx.lineWidth = hover ? 3.5 : 2;
      ctx.stroke();

      // Botón circular grande con el número del nivel
      ctx.fillStyle = hover ? '#ffd166' : '#fca311';
      ctx.beginPath();
      ctx.arc(0, -cardH / 2 + 45, 28, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#221528';
      ctx.font = '700 28px Fredoka';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(lvl.id), 0, -cardH / 2 + 46);

      // Título del nivel
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 22px Fredoka';
      ctx.fillText(lvl.name, 0, 18);

      // Icono
      ctx.font = '24px Fredoka';
      ctx.fillText(lvl.icon, 0, 50);

      // Subtítulo
      ctx.fillStyle = '#dcd2ea';
      ctx.font = '500 16px Fredoka';
      ctx.fillText(lvl.desc, 0, 78);

      ctx.restore();

      // Click o touch en la tarjeta
      if (mouse.clicked && hover) {
        mouse.clicked = false;
        audio.sfxClick();
        lvl.init();
        switchState(lvl.state);
      }
    });

    // Botón VOLVER al menú principal
    const btnBackHover = isMouseInBox(V_WIDTH / 2, V_HEIGHT / 2 + 175, 220, 50);
    drawButton(ctx, 0, 175, 220, 50, 'VOLVER', btnBackHover, '↩');
    if (mouse.clicked && btnBackHover) {
      mouse.clicked = false;
      audio.sfxClick();
      switchState(STATE.MENU);
    }

    ctx.restore();
  }

  // Pantalla de Créditos
  function drawCreditsScreen(ctx) {
    drawSky(ctx, 'day');
    drawMountains(ctx, 0);
    updateAndDrawAmbientLeaves(ctx);

    ctx.save();
    ctx.translate(V_WIDTH / 2, V_HEIGHT / 2);

    // Cuadro de pergamino
    ctx.fillStyle = 'rgba(30, 25, 38, 0.85)';
    ctx.beginPath();
    ctx.roundRect(-320, -220, 640, 440, 24);
    ctx.fill();

    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 3.5;
    ctx.stroke();

    ctx.fillStyle = '#ffd166';
    ctx.font = '700 40px Fredoka';
    ctx.textAlign = 'center';
    ctx.fillText('CRÉDITOS', 0, -150);

    ctx.fillStyle = '#ffffff';
    ctx.font = '500 20px Fredoka';
    ctx.fillText('Inspirado en el clásico de aventuras "Anika\'s Odyssey"', 0, -90);
    ctx.fillText('Desarrollado con HTML5, Canvas y Web Audio API sin librerías externas.', 0, -50);

    ctx.fillStyle = '#ffbe55';
    ctx.fillText('CONTROLES:', 0, 5);
    ctx.fillStyle = '#ffffff';
    ctx.font = '400 18px Fredoka';
    ctx.fillText('Moverse: Flechas Izquierda/Derecha o A / D', 0, 38);
    ctx.fillText('Saltar: Barra Espaciadora o Flecha Arriba / W', 0, 68);
    ctx.fillText('Móvil: Controles táctiles en pantalla', 0, 98);

    // Botón Volver
    const btnBackHover = isMouseInBox(V_WIDTH / 2, V_HEIGHT / 2 + 160, 220, 52);
    drawButton(ctx, 0, 160, 220, 52, 'VOLVER', btnBackHover, '◀');
    if (mouse.clicked && btnBackHover) {
      mouse.clicked = false;
      audio.sfxClick();
      switchState(STATE.MENU);
    }

    ctx.restore();
  }

  // ==========================================
  // 13. BUCLE PRINCIPAL DE JUEGO (GAME LOOP)
  // ==========================================
  let lastTime = performance.now();

  function gameLoop(now) {
    const dt = Math.min(0.1, (now - lastTime) / 1000);
    lastTime = now;

    // Actualizar visibilidad del botón de pausa (solo en los niveles 1, 2 y 3)
    const canPause = (currentState === STATE.LEVEL1 || currentState === STATE.LEVEL2 || currentState === STATE.LEVEL3);
    pauseToggleBtn.style.display = canPause ? 'flex' : 'none';

    // Si NO está en pausa, actualizar tiempo, música y física
    if (!isPaused) {
      stateTime += dt;

      // Actualizar música de fondo según el estado
      if (currentState === STATE.MENU || currentState === STATE.LEVEL_SELECT || currentState === STATE.CREDITS || currentState === STATE.CINE1) {
        audio.setMusicTrack('MENU');
      } else if (currentState === STATE.LEVEL1) {
        audio.setMusicTrack('LAKE');
      } else if (currentState === STATE.LEVEL2) {
        audio.setMusicTrack('WOLF');
      } else if (currentState === STATE.LEVEL3) {
        audio.setMusicTrack('PINE');
      } else if (currentState === STATE.CINE_FINAL || currentState === STATE.VICTORY) {
        audio.setMusicTrack('VICTORY');
      }

      // Actualizar lógica según el estado activo
      if (!pendingNextState || transitionAlpha < 1) {
        if (currentState === STATE.CINE1) cine1.update();
        else if (currentState === STATE.LEVEL1) level1.update();
        else if (currentState === STATE.LEVEL2) level2.update();
        else if (currentState === STATE.LEVEL3) level3.update();
        else if (currentState === STATE.CINE_FINAL) cineFinal.update();
      }

      particles.update();
    }

    // 1. SIEMPRE pintar primero un color base sólido para que NUNCA quede negro en ninguna franja
    const baseSkyColors = {
      [STATE.MENU]: '#78c6e8',
      [STATE.LEVEL_SELECT]: '#78c6e8',
      [STATE.CREDITS]: '#78c6e8',
      [STATE.CINE1]: '#78c6e8',
      [STATE.LEVEL1]: '#78c6e8',
      [STATE.LEVEL2]: '#78c6e8',  // Nivel 2 ahora usa fondo de día
      [STATE.LEVEL3]: '#0e1124',
      [STATE.CINE_FINAL]: '#533b68',
      [STATE.VICTORY]: '#533b68'
    };
    ctx.fillStyle = baseSkyColors[currentState] || '#78c6e8';
    ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

    // 2. Renderizado según el estado activo
    if (currentState === STATE.MENU) drawMenuScreen(ctx);
    else if (currentState === STATE.LEVEL_SELECT) drawLevelSelectScreen(ctx);
    else if (currentState === STATE.CREDITS) drawCreditsScreen(ctx);
    else if (currentState === STATE.CINE1) cine1.draw(ctx);
    else if (currentState === STATE.LEVEL1) level1.draw(ctx);
    else if (currentState === STATE.LEVEL2) level2.draw(ctx);
    else if (currentState === STATE.LEVEL3) level3.draw(ctx);
    else if (currentState === STATE.CINE_FINAL) cineFinal.draw(ctx);
    else if (currentState === STATE.VICTORY) drawVictoryScreen(ctx);

    // 3. Si está en pausa, dibujar el menú modal de pausa por encima
    if (isPaused) {
      drawPauseMenu(ctx);
    }

    // 4. Manejo de transiciones suaves entre estados (Fade to Black / Fade in)
    if (!isPaused) {
      if (pendingNextState) {
        transitionAlpha += transitionSpeed;
        if (transitionAlpha >= 1) {
          transitionAlpha = 1;
          if (transitionBlackHold > 0) {
            transitionBlackHold -= dt;
          } else {
            currentState = pendingNextState;
            pendingNextState = null;

            // Inicializar nuevo estado
            if (currentState === STATE.LEVEL1) level1.init();
            else if (currentState === STATE.LEVEL2) level2.init();
            else if (currentState === STATE.LEVEL3) level3.init();
            else if (currentState === STATE.CINE_FINAL) cineFinal.buildAssets();
          }
        }
      } else if (transitionAlpha > 0) {
        transitionAlpha -= transitionSpeed;
        if (transitionAlpha < 0) transitionAlpha = 0;
      }
    }

    if (transitionAlpha > 0) {
      ctx.fillStyle = `rgba(18, 14, 24, ${transitionAlpha})`;
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
    }

    // Resetear clic de ratón por fotograma
    mouse.clicked = false;
    keys.jumpPressed = false;

    requestAnimationFrame(gameLoop);
  }

  // Iniciar bucle
  requestAnimationFrame(gameLoop);

  </script>
