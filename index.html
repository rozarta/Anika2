  // Pino nórdico estilizado
  function drawPineTree(ctx, x, y, scale = 1, color = '#2b6348') {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Tronco
    ctx.fillStyle = '#543b2a';
    ctx.fillRect(-8, -40, 16, 40);

    // Capas triangulares redondeadas
    ctx.fillStyle = color;
    for (let i = 0; i < 4; i++) {
      const cy = -35 - i * 36;
      const w = 55 - i * 9;
      const h = 42;
      ctx.beginPath();
      ctx.moveTo(0, cy - h);
      ctx.lineTo(w, cy);
      ctx.quadraticCurveTo(0, cy - 6, -w, cy);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Botón estético estilizado para menús
  function drawButton(ctx, x, y, w, h, text, isHover = false, icon = '') {
    ctx.save();
    ctx.translate(x, y);

    // Sombra del botón
    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.beginPath();
    ctx.roundRect(-w / 2, -h / 2 + 5, w, h, 20);
    ctx.fill();

    // Fondo del botón con gradiente pastel cálido
    const grad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    if (isHover) {
      grad.addColorStop(0, '#ffd868');
      grad.addColorStop(1, '#ff9638');
    } else {
      grad.addColorStop(0, '#ffbe55');
      grad.addColorStop(1, '#f27829');
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(-w / 2, -h / 2, w, h, 20);
    ctx.fill();

    // Borde brillante
    ctx.strokeStyle = '#fff3d1';
    ctx.lineWidth = 3.5;
    ctx.stroke();

    // Texto del botón
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
    ctx.shadowOffsetY = 2;
    ctx.shadowBlur = 4;
    ctx.font = '700 24px Fredoka, Quicksand, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${icon ? icon + ' ' : ''}${text}`, 0, 1);

    ctx.restore();
  }

  // Comprobar si el ratón está sobre un botón
  function isMouseInBox(x, y, w, h) {
    return mouse.x >= x - w / 2 && mouse.x <= x + w / 2 &&
           mouse.y >= y - h / 2 && mouse.y <= y + h / 2;
  }

  // ==========================================
  // 6. CONTROLADOR DE ESTADOS Y TRANSICIONES
  // ==========================================
  function switchState(nextState, speed = 0.04, blackHold = 0) {
    if (pendingNextState) return;
    pendingNextState = nextState;
    transitionSpeed = speed;
    transitionBlackHold = blackHold;
  }

  // ==========================================
  // 7. CINEMÁTICA 1: EL RAPTO DEL PATITO
  // ==========================================
  const cine1 = {
    timer: 0,
    phase: 0, // 0: Sale de casa, 1: Aparece águila, 2: Robo, 3: Reacción y carrera
    girlX: 200,
    girlY: 530,
    hasDuck: true,
    eagleX: -120,
    eagleY: 80,
    eagleCarrying: false,
    fenceX: 740,
    cameraX: 0,

    reset() {
      this.timer = 0;
      this.phase = 0;
      this.girlX = 220;
      this.girlY = 530;
      this.hasDuck = true;
      this.eagleX = -100;
      this.eagleY = 60;
      this.eagleCarrying = false;
      this.cameraX = 0;
    },

    update() {
      this.timer += 1 / 60;

      // Fase 0: La niña sale de la casa caminando alegremente con su patito
      if (this.phase === 0) {
        this.girlX += 1.5;
        if (this.girlX >= 360) {
          this.phase = 1;
          this.timer = 0;
          audio.sfxEagle();
        }
      }
      // Fase 1: El águila cae en picada hacia la niña
      else if (this.phase === 1) {
        const targetX = this.girlX + 6;
        const targetY = this.girlY - 25;
        this.eagleX += (targetX - this.eagleX) * 0.06;
        this.eagleY += (targetY - this.eagleY) * 0.06;

        if (Math.abs(this.eagleX - targetX) < 18 && Math.abs(this.eagleY - targetY) < 18) {
          this.phase = 2;
          this.hasDuck = false;
          this.eagleCarrying = true;
          this.timer = 0;
          audio.sfxDuck();
          audio.sfxEagle();
        }
      }
      // Fase 2: El águila escapa volando alto hacia la derecha
      else if (this.phase === 2) {
        this.eagleX += 8.5;
        this.eagleY -= 4.2;

        if (this.timer > 1.2) {
          this.phase = 3;
          this.timer = 0;
        }
      }
      // Fase 3: La niña reacciona, llora un instante, salta la valla y corre hacia el bosque
      else if (this.phase === 3) {
        this.eagleX += 9.5;
        this.eagleY -= 2.5;

        if (this.timer > 0.8) {
          this.girlX += 5.2;

          // Salto sobre la valla
          if (this.girlX > this.fenceX - 60 && this.girlX < this.fenceX + 60) {
            this.girlY = 530 - Math.sin((this.girlX - (this.fenceX - 60)) / 120 * Math.PI) * 75;
          } else {
            this.girlY = 530;
          }

          this.cameraX = Math.max(0, this.girlX - 350);

          if (this.girlX >= 1150) {
            switchState(STATE.LEVEL1);
          }
        }
      }

      // Saltar cinemática con barra espaciadora o botón táctil
      if (keys.jumpPressed || keys.esc) {
        keys.jumpPressed = false;
        keys.esc = false;
        switchState(STATE.LEVEL1);
      }
    },

    draw(ctx) {
      // 1. En espacio de pantalla (cubre 100% del canvas sin importar el scroll)
      drawSky(ctx, 'day');

      // Nubes suaves
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(280, 140, 50, 0, Math.PI * 2);
      ctx.arc(330, 130, 65, 0, Math.PI * 2);
      ctx.arc(390, 145, 45, 0, Math.PI * 2);
      ctx.fill();

      // Montañas de fondo con parallax continuo (sin huecos)
      drawParallaxMountains(ctx, this.cameraX * 0.2, '#9fc0b5', '#7da397');

      // 2. En espacio de mundo con seguimiento de cámara
      ctx.save();
      ctx.translate(-this.cameraX, 0);

      // Suelo de pasto verde que cubre ampliamente ambos lados (sin huecos negros)
      ctx.fillStyle = '#65a854';
      ctx.fillRect(-1000, 530, 6000, V_HEIGHT - 530);

      // Capa de tierra debajo del pasto
      ctx.fillStyle = '#7a553c';
      ctx.fillRect(-1000, 544, 6000, V_HEIGHT - 544);

      // Bosque de fondo con árboles firmemente apoyados en el suelo (y = 530)
      for (let i = 0; i < 14; i++) {
        drawStoryTree(ctx, 420 + i * 115, 530, 0.85, '#6db576', '#694732');
      }

      // La casita acogedora de Anika (a la izquierda)
      this.drawHouse(ctx, 110, 530);

      // Flores en el jardín
      for (let fx = 180; fx < 2400; fx += 55) {
        ctx.fillStyle = fx % 110 === 0 ? '#ff7e79' : '#ffe169';
        ctx.beginPath();
        ctx.arc(fx, 533, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Valla de madera del jardín
      this.drawFence(ctx, this.fenceX, 530);

      // Dibujar Niña
      let anim = 'idle';
      if (this.phase === 0) anim = 'run';
      else if (this.phase === 1 || this.phase === 2) anim = 'cry';
      else if (this.phase === 3) {
        anim = (this.timer <= 0.8) ? 'cry' : (this.girlY < 525 ? 'jump' : 'run');
      }

      drawGirl(ctx, this.girlX, this.girlY, {
        scale: 1.5,
        facingRight: true,
        state: anim,
        animTime: stateTime,
        hasDuck: this.hasDuck
      });

      // Bocadillo de exclamación cuando el águila ataca
      if (this.phase === 1 || this.phase === 2) {
        ctx.save();
        ctx.translate(this.girlX + 20, this.girlY - 90);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e63946';
        ctx.font = '700 24px Fredoka';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', 0, 2);
        ctx.restore();
      }

      // Dibujar Águila (vuela en el aire, nunca entra a la tierra)
      if (this.phase > 0) {
        drawEagle(ctx, this.eagleX, this.eagleY, 1.4, stateTime * 14, this.eagleCarrying);
      }

      ctx.restore();

      // Botón flotante para SALTAR cinemática (en espacio de pantalla)
      const skipHover = isMouseInBox(V_WIDTH - 110, 42, 160, 42);
      drawButton(ctx, V_WIDTH - 110, 42, 160, 42, 'SALTAR ▶', skipHover);
      if (mouse.clicked && skipHover) {
        mouse.clicked = false;
        audio.sfxClick();
        switchState(STATE.LEVEL1);
      }
    },

    drawHouse(ctx, x, y) {
      ctx.save();
      ctx.translate(x, y);

      // Paredes de madera
      ctx.fillStyle = '#d99763';
      ctx.roundRect(-80, -110, 160, 110, 6);
      ctx.fill();

      // Chimenea
      ctx.fillStyle = '#8f5a43';
      ctx.fillRect(30, -165, 24, 60);

      // Humo de la chimenea
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.beginPath();
      ctx.arc(42, -175 - (stateTime * 15) % 40, 10, 0, Math.PI * 2);
      ctx.arc(46, -205 - (stateTime * 15) % 40, 15, 0, Math.PI * 2);
      ctx.fill();

      // Tejado a dos aguas
      ctx.fillStyle = '#9e382b';
      ctx.beginPath();
      ctx.moveTo(-105, -100);
      ctx.lineTo(0, -165);
      ctx.lineTo(105, -100);
      ctx.closePath();
      ctx.fill();

      // Ventana redonda con marco
      ctx.fillStyle = '#fff4cc';
      ctx.beginPath();
      ctx.arc(-35, -60, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#633d28';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Puerta rústica
      ctx.fillStyle = '#633d28';
      ctx.roundRect(15, -75, 38, 75, [18, 18, 0, 0]);
      ctx.fill();

      // Pomo dorado
      ctx.fillStyle = '#ffd13b';
      ctx.beginPath();
      ctx.arc(23, -36, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    },

    drawFence(ctx, x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#eae2d3';
      ctx.strokeStyle = '#c2b39f';
      ctx.lineWidth = 1.5;

      for (let i = -1; i <= 2; i++) {
        const px = i * 22;
        ctx.beginPath();
        ctx.moveTo(px - 7, 0);
        ctx.lineTo(px - 7, -42);
        ctx.lineTo(px, -52);
        ctx.lineTo(px + 7, -42);
        ctx.lineTo(px + 7, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Tablas horizontales
      ctx.fillRect(-30, -32, 90, 8);
      ctx.fillRect(-30, -16, 90, 8);

      ctx.restore();
    }
  };

  // ==========================================
  // 8. NIVEL 1: EL LAGO DE LAS ROCAS
  // ==========================================
  const level1 = {
    lives: 3,
    gameOver: false,
    player: {
      x: 80,
      y: 440,
      vx: 0,
      vy: 0,
      grounded: true,
      checkpointX: 80,
      checkpointY: 440,
      respawning: false,
      respawnTimer: 0,
      invulTimer: 0
    },
    cameraX: 0,
    lakeWidth: 2600,
    transitioning: false,

    // Plataformas y piedras del lago
    stones: [],

    init() {
      this.lives = 3;
      this.gameOver = false;
      this.player.x = 80;
      this.player.y = 440;
      this.player.vx = 0;
      this.player.vy = 0;
      this.player.grounded = true;
      this.player.facingRight = true;
      this.player.checkpointX = 80;
      this.player.checkpointY = 440;
      this.player.respawning = false;
      this.player.respawnTimer = 0;
      this.player.invulTimer = 0;
      this.cameraX = 0;
      this.transitioning = false;

      // Orilla inicial, piedras con separaciones calculadas y orilla final
      this.stones = [
        // Orilla inicial izquierda (hierba que termina exactamente en x = 220)
        { x: -294, y: 470, w: 1012, h: 250, isGround: true, left: -800, right: 212, safe: true },

        // Secuencia de piedras sobre el lago:
        // Primera piedra casi pegada al borde (canto visible de tierra=220, borde piedra=224).
        { x: 252, y: 472, w: 56, h: 68, safe: true },
        { x: 375, y: 462, w: 52, h: 78, safe: true },
        { x: 495, y: 474, w: 50, h: 66, safe: true },
        { x: 615, y: 462, w: 52, h: 78, safe: true },
        { x: 735, y: 474, w: 50, h: 66, safe: true },
        { x: 855, y: 460, w: 52, h: 80, safe: true },
        { x: 975, y: 474, w: 50, h: 66, safe: true },
        { x: 1095, y: 462, w: 52, h: 78, safe: true },
        { x: 1215, y: 472, w: 50, h: 68, safe: true },
        { x: 1335, y: 458, w: 52, h: 82, safe: true },
        { x: 1455, y: 472, w: 50, h: 68, safe: true },
        { x: 1575, y: 460, w: 52, h: 80, safe: true },
        { x: 1695, y: 474, w: 50, h: 66, safe: true },
        { x: 1815, y: 462, w: 52, h: 78, safe: true },
        { x: 1935, y: 470, w: 52, h: 70, safe: true },

        // Orilla final derecha (hierba natural que inicia en x = 2040, a solo 79px de la última piedra)
        { x: 3540, y: 470, w: 3000, h: 250, isGround: true, left: 2040, right: 5040, safe: true }
      ];
    },

    update() {
      const p = this.player;

      if (this.gameOver) return;

      if (p.invulTimer > 0) {
        p.invulTimer -= 1 / 60;
      }

      if (p.respawning) {
        p.respawnTimer -= 1 / 60;
        if (p.respawnTimer <= 0) {
          p.respawning = false;
          p.x = p.checkpointX;
          p.y = p.checkpointY;
          p.vx = 0;
          p.vy = 0;
          p.invulTimer = BLINK_DURATION; // Exactamente 2 parpadeos en 1 segundo
        }
        return;
      }

      // Si está en transición hacia el Nivel 2, Anika camina suavemente hacia el bosque
      if (this.transitioning) {
        p.vx = Math.max(p.vx, 3.2);
        p.facingRight = true;
      } else {
        // Controles horizontales del jugador
        if (keys.left) {
          p.vx = -PLAYER_SPEED;
          p.facingRight = false;
        } else if (keys.right) {
          p.vx = PLAYER_SPEED;
          p.facingRight = true;
        } else {
          p.vx *= 0.72; // Desaceleración suave
        }

        // Salto variable exclusivo del Nivel 1 (salto más bajo y exigente)
        if (keys.jumpPressed && p.grounded) {
          p.vy = JUMP_FORCE_LAKE;
          p.grounded = false;
          keys.jumpPressed = false;
          audio.sfxJump();
          // Polvareda al saltar
          for (let i = 0; i < 4; i++) {
            particles.add({
              x: p.x + (Math.random() * 14 - 7),
              y: p.y,
              vx: Math.random() * 2 - 1,
              vy: -Math.random() * 1.5,
              size: 2.8,
              color: '#d6cfc2',
              life: 22
            });
          }
        }

        // Salto sostenido con rango más corto (exige calcular la pulsación)
        if (keys.jump && p.vy < 0) {
          p.vy += JUMP_HOLD_BOOST_LAKE;
        }
      }

      // Gravedad
      p.vy += GRAVITY;

      // Movimiento
      p.x += p.vx;
      p.y += p.vy;

      // Comprobación de aterrizaje sobre piedras u orillas
      // Hitbox ajustada para que los pies no caigan mientras estén sobre tierra o piedra
      p.grounded = false;
      const footTol = 8;
      for (const stone of this.stones) {
        const top = stone.y;
        const left = stone.isGround ? (stone.left !== undefined ? stone.left : stone.x - stone.w / 2) : (stone.x - stone.w / 2);
        const right = stone.isGround ? (stone.right !== undefined ? stone.right : stone.x + stone.w / 2) : (stone.x + stone.w / 2);

        // Solo cae si el centro de sus pies queda realmente fuera de toda plataforma
        const platformTolerance = stone.isGround ? 0 : footTol;
        if (p.x >= left - platformTolerance && p.x <= right + platformTolerance) {
          if (p.y >= top && p.y - p.vy <= top + 18 && p.vy >= 0) {
            p.y = top;
            p.vy = 0;
            p.grounded = true;
            if (stone.safe) {
              p.checkpointX = stone.isGround ? Math.max(80, Math.min(p.x, right - 40)) : stone.x;
              p.checkpointY = stone.y;
            }
          }
        }
      }

      // Caída al agua: pierde un corazón con chapoteo y reaparición en la última piedra segura
      if (p.y > 520 && !p.respawning) {
        audio.sfxSplash();
        this.lives = Math.max(0, this.lives - 1);
        p.respawning = true;
        p.respawnTimer = 0.85;

        // Salpicaduras de agua
        for (let i = 0; i < 24; i++) {
          particles.add({
            x: p.x,
            y: 520,
            vx: (Math.random() * 6 - 3),
            vy: -(Math.random() * 5 + 3),
            size: 3.5,
            color: '#a7e4f9',
            life: 38,
            gravity: 0.28
          });
        }

        // Si pierde las 3 vidas: Game Over
        if (this.lives <= 0) {
          this.gameOver = true;
          return;
        }
      }

      // Transición invisible al adentrarse en la orilla del bosque (sin portal ni texto)
      if (p.x >= 2220 && !this.transitioning) {
        this.transitioning = true;
        // Fade out suave de ~1 segundo (velocidad 0.016), momento en negro de 0.5s y fade in directo al Nivel 2
        switchState(STATE.LEVEL2, 0.016, 0.5);
      }

      // Suave seguimiento de cámara
      const targetCamX = p.x - V_WIDTH * 0.38;
      this.cameraX += (targetCamX - this.cameraX) * 0.08;
      this.cameraX = Math.max(0, Math.min(this.cameraX, this.lakeWidth - V_WIDTH));
    },

    draw(ctx) {
      // 1. Fondo en espacio de pantalla (cubre 100% de la ventana sin huecos ni franjas negras)
      drawSky(ctx, 'day');

      // Montañas de fondo con parallax continuo (tileado)
      drawParallaxMountains(ctx, this.cameraX * 0.08, '#94b8ac', '#779e91');

      // Colinas y orilla lejana en el horizonte (sin árboles flotando sobre el agua)
      drawParallaxLakeHills(ctx, this.cameraX * 0.16);

      // 2. Capa de mundo con seguimiento de cámara
      ctx.save();
      ctx.translate(-this.cameraX, 0);

      // Agua del lago: se dibuja antes de la tierra para mantenerla siempre detrás de las orillas.
      const waterY = 505;
      const waterGrad = ctx.createLinearGradient(0, waterY, 0, V_HEIGHT);
      waterGrad.addColorStop(0, '#53a8be');
      waterGrad.addColorStop(0.3, '#32778f');
      waterGrad.addColorStop(1, '#1b4b5e');
      ctx.fillStyle = waterGrad;
      ctx.fillRect(220, waterY, 1820, V_HEIGHT - waterY);

      // Ondulaciones y reflejos brillantes del agua
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 2.5;
      for (let i = 0; i < 18; i++) {
        const waveX = (i * 150 + stateTime * 35) % 1780 + 230;
        const waveY = waterY + 8 + (i % 5) * 18;
        ctx.beginPath();
        ctx.moveTo(waveX, waveY);
        ctx.quadraticCurveTo(waveX + 30, waveY - 4, waveX + 60, waveY);
        ctx.stroke();
      }

      // Nenúfares y flores flotantes sobre el agua (única vegetación en el lago)
      for (let i = 0; i < 12; i++) {
        const lx = 280 + i * 145;
        const ly = waterY + 12 + (i % 3) * 14;
        ctx.fillStyle = '#48974a';
        ctx.beginPath();
        ctx.ellipse(lx, ly, 15, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        if (i % 2 === 0) {
          ctx.fillStyle = '#ff9ebb';
          ctx.beginPath();
          ctx.arc(lx, ly - 2, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Orilla inicial: bloque continuo de tierra y césped alineados en el borde x = 220.
      ctx.fillStyle = '#7a553c';
      ctx.fillRect(-800, 486, 1020, V_HEIGHT - 486);
      ctx.fillStyle = '#65a854';
      ctx.beginPath();
      ctx.moveTo(-800, 470);
      ctx.lineTo(212, 470);
      ctx.quadraticCurveTo(220, 470, 220, 478);
      ctx.lineTo(220, 486);
      ctx.lineTo(-800, 486);
      ctx.closePath();
      ctx.fill();

      // Orilla de llegada en bloque continuo, con el canto vertical sólido.
      ctx.fillStyle = '#7a553c';
      ctx.fillRect(2040, 486, 3000, V_HEIGHT - 486);
      ctx.fillStyle = '#65a854';
      ctx.fillRect(2040, 470, 3000, 16);

      // Árboles apoyados en el césped, dibujados después del agua y de las orillas.
      drawStoryTree(ctx, -30, 470, 0.95, '#569363', '#533b2a');
      drawStoryTree(ctx, 50, 470, 0.82, '#62a868', '#5e4331');
      drawStoryTree(ctx, 130, 470, 0.88, '#4f8c5b', '#4d3625');

      // Bosque de la orilla de llegada (árboles plantados sobre el pasto a y = 470)
      const forestArrivalX = [2080, 2170, 2260, 2360, 2460, 2570, 2690, 2810];
      const foliagePalettes = ['#4e8c56', '#5ca865', '#3e7845', '#559c5d'];
      forestArrivalX.forEach((tx, idx) => {
        drawStoryTree(ctx, tx, 470, 0.85 + (idx % 3) * 0.1, foliagePalettes[idx % 4], '#533b2a');
      });

      // Dibujar Piedras del lago
      for (const s of this.stones) {
        if (!s.isGround) {
          ctx.save();
          ctx.translate(s.x, s.y);

          // Cuerpo de la roca
          ctx.fillStyle = '#787b87';
          ctx.beginPath();
          ctx.roundRect(-s.w / 2, 0, s.w, s.h, [14, 14, 8, 8]);
          ctx.fill();

          // Detalle de sombra en la roca
          ctx.fillStyle = '#595b64';
          ctx.beginPath();
          ctx.roundRect(-s.w / 2 + 5, 10, s.w - 10, s.h - 10, 5);
          ctx.fill();

          // Capa de musgo verde superior
          ctx.fillStyle = '#83b85e';
          ctx.beginPath();
          ctx.roundRect(-s.w / 2 - 2, -2, s.w + 4, 10, 5);
          ctx.fill();

          // Destello de agua en la base
          ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.fillRect(-s.w / 2, s.h - 5, s.w, 3);

          ctx.restore();
        }
      }

      // Dibujar Jugadora (si no está esperando respawn)
      const p = this.player;
      if (!p.respawning && isPlayerBlinkVisible(p.invulTimer)) {
        let pAnim = 'idle';
        if (!p.grounded) {
          pAnim = p.vy < 0 ? 'jump' : 'fall';
        } else if (Math.abs(p.vx) > 0.4) {
          pAnim = 'run';
        }

        drawGirl(ctx, p.x, p.y, {
          scale: 1.45,
          facingRight: p.facingRight,
          state: pAnim,
          animTime: stateTime,
          hasDuck: false
        });
      }

      // Partículas
      particles.draw(ctx, 0, 0);

      ctx.restore();

      // Indicadores en pantalla (HUD en espacio de pantalla con zonas organizadas)
      this.drawHUD(ctx);

      // Modal de Game Over al perder las 3 vidas
      if (this.gameOver) {
        drawGameOverModal(ctx,
          () => { this.gameOver = false; this.init(); },
          () => { this.gameOver = false; isPaused = false; switchState(STATE.MENU); }
        );
      }
    },

    drawHUD(ctx) {
      // 1. Esquina superior izquierda: marco con texto de instrucciones (ancho medido, maxW=330)
      drawInstructionBox(ctx, 'Nivel 1: Salta de piedra en piedra hasta la otra orilla.', 24, 20, 330);

      // 2. Centro superior: barra de progreso (ancho máx 260, centrado con margen amplio)
      ctx.save();
      const barW = 260;
      const barX = V_WIDTH / 2 - barW / 2;
      const barY = 20;
      const progress = Math.min(1, Math.max(0, this.player.x / this.lakeWidth));

      ctx.fillStyle = 'rgba(25, 28, 36, 0.65)';
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW, 26, 13);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.roundRect(barX + 6, barY + 6, barW - 12, 14, 7);
      ctx.fill();

      ctx.fillStyle = '#7fe58a';
      ctx.beginPath();
      ctx.roundRect(barX + 6, barY + 6, (barW - 12) * progress, 14, 7);
      ctx.fill();

      // Iconos flanqueando la barra
      ctx.font = '16px Fredoka';
      ctx.textAlign = 'center';
      ctx.fillText('👧', barX - 16, barY + 18);
      ctx.fillText('🌲', barX + barW + 16, barY + 18);
      ctx.restore();

      // 3. Corazones: 3 vidas, centrados justo debajo de la barra de progreso
      drawHearts(ctx, this.lives, 3, V_WIDTH / 2, 54);
    }
  };

  // ==========================================
  // 9. NIVEL 2: EL LOBO FEROZ (Runner Automático)
  // ==========================================
  const level2 = {
    distance: 0,
    targetDistance: 7600,  // Nivel ampliado: más recorrido para acumular tropiezos y permitir que el lobo alcance a Anika.
    scrollSpeed: 5.6,
    baseScrollSpeed: RUNNER_BASE_SCROLL_SPEED,
    lives: 3,
    gameOver: false,
    invulTimer: 0,   // segundos de invulnerabilidad tras ser atrapada
    biteActive: false,

    // Jugadora
    player: {
      x: 360,
      y: 530,
      vy: 0,
      grounded: true,
      stumbleTimer: 0
    },

    // Lobo que persigue desde atrás
    wolf: {
      distanceBehind: 300,
      growlCooldown: 0,
      y: 530,          // posición vertical actual del lobo
      vy: 0,           // velocidad vertical (para saltar troncos)
      jumpCooldown: 0  // evitar saltar repetidamente el mismo tronco
    },

    // Obstáculos (Troncos caídos)
    obstacles: [],
    spawnTimer: 0,
    nextLogWidth: 0,
    spawnPhase: 0,   // controla la variación del ritmo de aparición

    init() {
      this.distance = 0;
      this.scrollSpeed = this.baseScrollSpeed;
      this.lives = 3;
      this.gameOver = false;
      this.invulTimer = 0;
      this.biteActive = false;
      this.player.y = 530;
      this.player.vy = 0;
      this.player.grounded = true;
      this.player.stumbleTimer = 0;
      this.wolf.distanceBehind = 300;
      this.wolf.growlCooldown = 0;
      this.wolf.y = 530;
      this.wolf.vy = 0;
      this.wolf.jumpCooldown = 0;
      this.obstacles = [];
      this.spawnTimer = 80 * this.baseScrollSpeed;
      this.nextLogWidth = 54 + Math.random() * 22;
      this.spawnPhase = 0;
    },

    update() {
      const p = this.player;
      const w = this.wolf;

      if (this.gameOver) return;

      this.distance += this.scrollSpeed;
      this.spawnPhase++;

      // --- Generación rítmica sin pares pegados; el claro real nunca es menor a 1.5 saltos ---
      this.spawnTimer -= this.scrollSpeed;
      if (this.spawnTimer <= 0 && this.distance < this.targetDistance - 600) {
        const logH = 34 + Math.random() * 12;
        const logW = this.nextLogWidth || (54 + Math.random() * 22);
        const nextWidth = 54 + Math.random() * 22;

        this.obstacles.push({
          x: V_WIDTH + 80,
          y: 530,
          w: logW,
          h: logH,
          passed: false,
          wolfPassed: false
        });

        // El claro entre bordes se varía dentro del intervalo calculado, con respiro extra ocasional.
        const section = Math.floor(this.distance / 700) % 3;
        const gapFloor = section === 2 ? LOG_MIN_GAP + (LOG_MAX_GAP - LOG_MIN_GAP) * 0.35 : LOG_MIN_GAP;
        const gapCeiling = section === 1 ? LOG_MIN_GAP + (LOG_MAX_GAP - LOG_MIN_GAP) * 0.72 : LOG_MAX_GAP;
        const clearGap = gapFloor + Math.random() * (gapCeiling - gapFloor);
        this.spawnTimer = logW / 2 + clearGap + nextWidth / 2;
        this.nextLogWidth = nextWidth;
      }

      // --- Salto de la niña (JUMP_FORCE_WOLF ajustado +13% para superar holgadamente los troncos) ---
      if (keys.jumpPressed && p.grounded) {
        p.vy = JUMP_FORCE_WOLF;
        p.grounded = false;
        keys.jumpPressed = false;
        audio.sfxJump();
      }
      if (keys.jump && p.vy < 0) {
        p.vy += JUMP_HOLD_BOOST_WOLF;
      }

      // Gravedad de la niña
      p.vy += GRAVITY;
      p.y += p.vy;
      if (p.y >= 530) {
        p.y = 530;
        p.vy = 0;
        p.grounded = true;
      }

      // --- Temporizador de invulnerabilidad ---
      if (this.invulTimer > 0) {
        this.invulTimer -= 1 / 60;
        if (this.invulTimer <= 0) {
          this.invulTimer = 0;
          this.biteActive = false;
        }
      }

      // --- Tropieza con tronco: el lobo se acerca ---
      if (p.stumbleTimer > 0) {
        p.stumbleTimer--;
        this.scrollSpeed = 3.2;
        w.distanceBehind = Math.max(95, w.distanceBehind - 2.5);
      } else {
        this.scrollSpeed = this.baseScrollSpeed;
        w.distanceBehind = Math.min(300, w.distanceBehind + 0.3);
      }

      // --- Actualizar obstáculos y colisión niña ---
      for (let i = this.obstacles.length - 1; i >= 0; i--) {
        const obs = this.obstacles[i];
        obs.x -= this.scrollSpeed;

        // Colisión de la niña con el tronco
        if (!obs.passed) {
          const girlLeft = p.x - 14;
          const girlRight = p.x + 14;
          const girlBottom = p.y;
          const girlTop = p.y - 52;
          const obsLeft = obs.x - obs.w / 2;
          const obsRight = obs.x + obs.w / 2;
          const obsTop = obs.y - obs.h;

          if (girlRight > obsLeft && girlLeft < obsRight && girlBottom > obsTop) {
            obs.passed = true;
            p.stumbleTimer = 45;
            audio.sfxGrowl();
            for (let k = 0; k < 10; k++) {
              particles.add({
                x: obs.x,
                y: obs.y - obs.h / 2,
                vx: Math.random() * 5 - 2,
                vy: -Math.random() * 4 - 2,
                size: 4,
                color: '#8b5a36',
                life: 30
              });
            }
          }
        }

        // --- Lobo salta el tronco (+20% más alto, pasa claramente sin rozar) ---
        // wolfX en coordenadas de pantalla: p.x - w.distanceBehind
        if (!obs.wolfPassed && w.vy === 0 && w.jumpCooldown <= 0) {
          // Posición del tronco relativa al lobo (en pantalla)
          const troncoRelX = obs.x - (p.x - w.distanceBehind);
          if (troncoRelX > 20 && troncoRelX < 90) {
            // El tronco está justo adelante del lobo → saltar con gran arco
            w.vy = -9.2;
            w.jumpCooldown = 40;
            // El lobo pierde algo de velocidad al saltar (se separa un poco)
            if (w.distanceBehind < 300) {
              w.distanceBehind = Math.min(300, w.distanceBehind + 18);
            }
          }
        }
        if (obs.wolfPassed === false) {
          // marcar el tronco como superado por el lobo cuando ya pasó
          const troncoRelX = obs.x - (p.x - w.distanceBehind);
          if (troncoRelX < -20) {
            obs.wolfPassed = true;
          }
        }

        if (obs.x < -150) {
          this.obstacles.splice(i, 1);
        }
      }

      // --- Física del lobo (salto sobre troncos) ---
      if (w.vy !== 0) {
        w.vy += GRAVITY;
        w.y += w.vy;
        if (w.y >= 530) {
          w.y = 530;
          w.vy = 0;
        }
      }
      if (w.jumpCooldown > 0) w.jumpCooldown--;

      // --- Gruñido periódico si el lobo está cerca ---
      w.growlCooldown--;
      if (w.distanceBehind < 160 && w.growlCooldown <= 0) {
        audio.sfxGrowl();
        w.growlCooldown = 110;
      }

      // --- Si el lobo atrapa a la niña (y no está invulnerable) ---
      if (w.distanceBehind <= 95 && this.invulTimer <= 0 && !this.biteActive) {
        audio.sfxGrowl();
        this.biteActive = true;
        this.lives = Math.max(0, this.lives - 1);
        if (this.lives <= 0) {
          this.gameOver = true;
          return;
        }
        // Reaparecer: empujar al lobo hacia atrás y dar invulnerabilidad
        w.distanceBehind = 280;
        this.invulTimer = BLINK_DURATION;
        p.stumbleTimer = 30;   // Animación de tropiezo breve
        return;
      }

      // Meta: Llegar al Gran Pino
      if (this.distance >= this.targetDistance) {
        audio.sfxVictory();
        switchState(STATE.LEVEL3);
      }
    },

    draw(ctx) {
      // Fondo de DÍA (igual que el nivel 1): cielo, montañas verdes, árboles de bosque
      drawSky(ctx, 'day');
      drawParallaxMountains(ctx, this.distance * 0.08, '#94b8ac', '#779e91');

      // Árboles del bosque con parallax en mosaico (bases en y=530, paleta del nivel 1)
      for (let i = 0; i < 14; i++) {
        const tx = ((i * 185 - this.distance * 0.38) % (V_WIDTH + 370) + V_WIDTH + 370) % (V_WIDTH + 370) - 185;
        const sc = 0.78 + (i % 3) * 0.08;
        const fc = ['#4e8c56', '#5ca865', '#3e7845', '#62a868'][i % 4];
        drawStoryTree(ctx, tx, 530, sc, fc, '#533b2a');
      }

      // El Gran Pino visible desde el inicio en el horizonte derecho,
      // acercándose y aumentando su escala con el progreso del nivel hasta sus pies
      const prog = Math.min(1, Math.max(0, this.distance / this.targetDistance));
      const pineX = (V_WIDTH - 140) - prog * (V_WIDTH - 140 - 540);
      const pineScale = 1.35 + prog * 1.85;
      drawPineTree(ctx, pineX, 530, pineScale, '#1e4832');

      // Suelo con pasto verde (igual al nivel 1) y tierra marrón debajo
      ctx.fillStyle = '#65a854';
      ctx.fillRect(0, 530, V_WIDTH, 16);
      ctx.fillStyle = '#7a553c';
      ctx.fillRect(0, 546, V_WIDTH, V_HEIGHT - 546);

      // Líneas de velocidad en el suelo (tierra)
      ctx.strokeStyle = '#8f6040';
      ctx.lineWidth = 2.5;
      for (let i = 0; i < 8; i++) {
        const lx = ((i * 200 - this.distance * 1.1) % (V_WIDTH + 200) + V_WIDTH + 200) % (V_WIDTH + 200) - 100;
        ctx.beginPath();
        ctx.moveTo(lx, 558 + (i % 3) * 14);
        ctx.lineTo(lx + 65, 558 + (i % 3) * 14);
        ctx.stroke();
      }

      // Dibujar Obstáculos (Troncos apoyados sobre el suelo: base en y=530, se dibujan hacia arriba)
      for (const obs of this.obstacles) {
        ctx.save();
        // Los troncos tienen base en y=530 → translateY al suelo
        ctx.translate(obs.x, 530);

        // Cuerpo del tronco (de y=0 hacia arriba -obs.h)
        ctx.fillStyle = '#5c3a21';
        ctx.beginPath();
        ctx.roundRect(-obs.w / 2, -obs.h, obs.w, obs.h, [8, 8, 3, 3]);
        ctx.fill();

        // Anillos de corte en el lateral izquierdo
        ctx.fillStyle = '#d49b6a';
        ctx.beginPath();
        ctx.ellipse(-obs.w / 2 + 5, -obs.h / 2, 5, obs.h / 2 - 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Musgo en la cima
        ctx.fillStyle = '#65a854';
        ctx.beginPath();
        ctx.roundRect(-obs.w / 2 + 3, -obs.h - 4, obs.w - 6, 8, 4);
        ctx.fill();

        // Raíz decorativa en la base
        ctx.fillStyle = '#7a553c';
        ctx.beginPath();
        ctx.roundRect(-obs.w / 2 - 4, -6, obs.w + 8, 6, 3);
        ctx.fill();

        ctx.restore();
      }

      // Dibujar Lobo corriendo articulado (con salto dinámico sobre troncos)
      const w = this.wolf;
      const wolfX = this.player.x - w.distanceBehind;
      const wolfMouth = w.distanceBehind < 180;
      const isWolfJumping = w.vy !== 0 || w.y < 530;
      drawWolf(ctx, wolfX, w.y, 1.55, stateTime, wolfMouth, isWolfJumping);

      // Dibujar a Anika (parpadeante si invulnerable)
      const p = this.player;
      const blinkVisible = isPlayerBlinkVisible(this.invulTimer);

      if (blinkVisible) {
        let pAnim = 'run';
        if (!p.grounded) {
          pAnim = p.vy < 0 ? 'jump' : 'fall';
        } else if (p.stumbleTimer > 0) {
          pAnim = 'cry';
        }
        drawGirl(ctx, p.x, p.y, {
          scale: 1.5,
          facingRight: true,
          state: pAnim,
          animTime: stateTime,
          hasDuck: false
        });
      }

      // Partículas
      particles.draw(ctx, 0, 0);

      // HUD
      this.drawHUD(ctx);

      // Modal de Game Over
      if (this.gameOver) {
        drawGameOverModal(ctx,
          () => { this.gameOver = false; this.init(); },
          () => { this.gameOver = false; isPaused = false; switchState(STATE.MENU); }
        );
      }
    },

    drawHUD(ctx) {
      // --- ZONA SUPERIOR IZQUIERDA: instrucciones (maxW=340) ---
      drawInstructionBox(ctx, 'Nivel 2: ¡Salta los troncos caídos para escapar del lobo!', 24, 20, 340);

      ctx.save();

      // Alerta si el lobo está muy cerca
      if (this.wolf.distanceBehind < 160) {
        ctx.fillStyle = 'rgba(230, 57, 70, 0.22)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        ctx.fillStyle = '#ff4d4d';
        ctx.font = '700 22px Fredoka';
        ctx.textAlign = 'center';
        ctx.fillText('¡EL LOBO SE ACERCA!', V_WIDTH / 2, 108);
      }

      // --- ZONA SUPERIOR CENTRO: barra de progreso (ancho 280, centrada) ---
      const barW = 280;
      const barX = V_WIDTH / 2 - barW / 2;
      const barY = 20;
      const prog = Math.min(1, this.distance / this.targetDistance);

      ctx.fillStyle = 'rgba(25, 28, 36, 0.65)';
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW, 28, 14);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.roundRect(barX + 8, barY + 8, barW - 16, 12, 6);
      ctx.fill();

      ctx.fillStyle = '#fca311';
      ctx.beginPath();
      ctx.roundRect(barX + 8, barY + 8, (barW - 16) * prog, 12, 6);
      ctx.fill();

      // Iconos flanqueando la barra
      ctx.font = '18px Fredoka';
      ctx.textAlign = 'center';
      ctx.fillText('🐺', barX - 18, barY + 18);
      ctx.fillText('🌲', barX + barW + 18, barY + 18);

      ctx.restore();

      // --- CORAZONES: 3 vidas centradas justo debajo de la barra de progreso ---
      drawHearts(ctx, this.lives, 3, V_WIDTH / 2, 56);
    }
  };

  // ==========================================
  // 10. NIVEL 3: EL GRAN PINO (Doodle Jump / Vertical)
  // ==========================================
  const level3 = {
    lives: 3,
    gameOver: false,
    invulTimer: 0,
    victoryStarted: false,
    player: {
      x: V_WIDTH / 2,
      y: 520,
      vx: 0,
      vy: 0,
      facingRight: true,
      lastSafeX: V_WIDTH / 2,
      lastSafeY: 560,
      onGround: false,
      supportBranch: null
    },
    cameraY: 0,
    targetHeight: 3600, // Altura del árbol a escalar
    branches: [],
    nest: { x: V_WIDTH / 2, y: -3550 },

    getBranchReach(rise) {
      const jumpSpeed = Math.abs(JUMP_FORCE_PINE);
      if (rise < 0 || rise > PINE_MAX_RISE) return 0;
      const descendingTime = (jumpSpeed + Math.sqrt(jumpSpeed * jumpSpeed - 2 * PINE_GRAVITY * rise)) / PINE_GRAVITY;
      return MOVE_SPEED_PINE * descendingTime;
    },

    validateBranchReach(branch, previous, existingBranches = []) {
      const trunkLeft = V_WIDTH / 2 - 95;
      const trunkRight = V_WIDTH / 2 + 95;
      const setBranchX = () => {
        if (branch.type === 'nestBranch') {
          branch.x = V_WIDTH / 2;
        } else if (branch.branchSide < 0) {
          branch.x = trunkLeft - branch.w / 2 + PINE_BRANCH_INSET;
        } else if (branch.branchSide > 0) {
          branch.x = trunkRight + branch.w / 2 - PINE_BRANCH_INSET;
        }
      };
      setBranchX();

      let rise = previous.y - branch.y;
      rise = Math.max(BRANCH_VERTICAL_GAP * 0.96, Math.min(BRANCH_VERTICAL_GAP, rise));
      branch.y = previous.y - rise;

      if (!branch.sameSideException && branch.branchSide !== 0) {
        for (const candidate of existingBranches) {
          if (candidate.sameSideException || candidate.branchSide !== branch.branchSide) continue;
          if (Math.abs(candidate.y - branch.y) <= PINE_MAX_RISE) {
            branch.y = Math.min(branch.y, candidate.y - PINE_MAX_RISE * 1.05);
          }
        }
      }

      rise = previous.y - branch.y;
      if (rise > BRANCH_VERTICAL_GAP) {
        branch.branchSide = -previous.branchSide;
        branch.y = previous.y - BRANCH_VERTICAL_GAP;
        setBranchX();
        rise = BRANCH_VERTICAL_GAP;
      }

      const movingAllowance = (branch.type === 'moving' ? 18 : 0) + (previous.type === 'moving' ? 18 : 0);
      let edgeGap = Math.max(0, Math.abs(branch.x - previous.x) - (branch.w + previous.w) / 2) + movingAllowance;
      const allowedGap = this.getBranchReach(rise) * BRANCH_HORIZONTAL_REACH_RATIO;
      if (edgeGap > allowedGap) {
        branch.x -= Math.sign(branch.x - previous.x) * (edgeGap - allowedGap);
        edgeGap = allowedGap;
      }
      branch.baseX = branch.x;
      branch.previousX = branch.x;
      return branch;
    },

    init() {
      this.lives = 3;
      this.gameOver = false;
      this.invulTimer = 0;
      this.victoryStarted = false;
      duckInNest = true;
      this.player.x = V_WIDTH / 2;
      this.player.y = 520;
      this.player.vx = 0;
      this.player.vy = 0;
      this.player.facingRight = true;
      this.player.lastSafeX = V_WIDTH / 2;
      this.player.lastSafeY = 560;
      this.player.onGround = false;
      this.player.supportBranch = null;
      this.cameraY = 0;
      this.branches = [];

      // Rama base segura
      const baseBranch = {
        x: V_WIDTH / 2,
        y: 560,
        w: 240,
        type: 'normal',
        baseX: V_WIDTH / 2,
        broken: false,
        cracking: 0,
        angle: 0,
        foliageScale: 1
      };
      this.branches.push(baseBranch);

      // Una rama por piso, alternando hacia fuera del tronco en un zigzag regular.
      let previous = baseBranch;
      let row = 0;
      let previousRowFragile = false;
      while (previous.y > -this.targetHeight + 155) {
        const side = -previous.branchSide || (row % 2 === 0 ? -1 : 1);
        const width = 174 + Math.random() * 22;
        const type = row % 8 === 3 ? 'moving' : row % 9 === 7 ? 'spring' : 'normal';
        const branch = this.validateBranchReach({
          x: 0,
          y: previous.y - BRANCH_VERTICAL_GAP * (0.96 + Math.random() * 0.08),
          w: width,
          type,
          moveOffset: Math.random() * Math.PI * 2,
          broken: false,
          cracking: 0,
          branchSide: side,
          foliageScale: 0.82 + Math.random() * 0.32
        }, previous, this.branches);
        this.branches.push(branch);

        const addFragileAlternative = row > 0 && !previousRowFragile && Math.random() < SAME_SIDE_CHANCE;
        if (addFragileAlternative) {
          const fragileBranch = this.validateBranchReach({
            x: 0,
            y: branch.y,
            w: 160 + Math.random() * 18,
            type: 'fragile',
            moveOffset: 0,
            broken: false,
            cracking: 0,
            branchSide: previous.branchSide,
            sameSideException: true,
            foliageScale: 0.82 + Math.random() * 0.32
          }, previous, this.branches);
          this.branches.push(fragileBranch);
        }

        previous = branch;
        previousRowFragile = addFragileAlternative;
        row++;
      }

      // Plataforma final ancha y estable, con el nido justo encima.
      this.nest.x = V_WIDTH / 2;
      const nestBranch = this.validateBranchReach({
        x: V_WIDTH / 2,
        y: previous.y - BRANCH_VERTICAL_GAP,
        w: 696,
        type: 'nestBranch',
        broken: false,
        cracking: 0,
        angle: 0,
        foliageScale: 1
      }, previous, this.branches);
      this.nest.y = nestBranch.y - 18;
      this.branches.push(nestBranch);
    },

    update() {
      const p = this.player;

      if (this.gameOver || this.victoryStarted) return;

      if (this.invulTimer > 0) {
        this.invulTimer -= 1 / 60;
      }

      // Mover la rama bajo los pies junto con la niña, antes de leer controles.
      for (const b of this.branches) {
        b.previousX = b.x;
        if (b.cracking > 0) {
          b.cracking -= 1 / 60;
          if (b.cracking <= 0) b.broken = true;
        }
        if (b.type === 'moving') {
          b.x = b.baseX + Math.sin(stateTime * 2.5 + b.moveOffset) * 18;
        }
      }

      const wasGrounded = p.onGround && p.supportBranch && !p.supportBranch.broken;
      if (wasGrounded && p.supportBranch.type === 'moving') {
        p.x += p.supportBranch.x - p.supportBranch.previousX;
      }

      // Solo puede saltar desde el apoyo confirmado en el frame anterior.
      const jumpedFromSupport = keys.jumpPressed && wasGrounded;
      if (jumpedFromSupport) {
        p.vy = JUMP_FORCE_PINE;
        p.onGround = false;
        p.supportBranch = null;
        keys.jumpPressed = false;
        audio.sfxJump();
      }

      // Movimiento horizontal ágil (MOVE_SPEED_PINE), sin teletransporte lateral.
      if (keys.left) {
        p.vx = -MOVE_SPEED_PINE;
        p.facingRight = false;
      } else if (keys.right) {
        p.vx = MOVE_SPEED_PINE;
        p.facingRight = true;
      } else {
        p.vx *= 0.82;
      }

      p.x += p.vx;
      p.x = Math.max(18, Math.min(V_WIDTH - 18, p.x));

      const previousY = p.y;
      const remainsOnBranch = wasGrounded && !jumpedFromSupport &&
        p.x >= p.supportBranch.x - p.supportBranch.w / 2 &&
        p.x <= p.supportBranch.x + p.supportBranch.w / 2;
      if (remainsOnBranch && !jumpedFromSupport) {
        p.y = p.supportBranch.y;
        p.vy = 0;
        p.onGround = true;
      } else {
        p.onGround = false;
        p.supportBranch = null;
        // Sin apoyo, la gravedad es la única fuerza vertical salvo salto o impulso.
        p.vy += GRAVITY * 0.85;
        p.y += p.vy;
      }

      // Colisión unidireccional: únicamente al caer, cruzando desde arriba la línea sólida.
      if (p.vy > 0) {
        for (const b of this.branches) {
          if (b.broken) continue;
          const overlapsPlatform = p.x >= b.x - b.w / 2 && p.x <= b.x + b.w / 2;
          const crossedTop = previousY <= b.y && p.y >= b.y;
          if (!overlapsPlatform || !crossedTop) continue;

          p.y = b.y;
          if (b.type === 'nestBranch') {
            p.vy = 0;
            p.onGround = true;
            p.supportBranch = b;
            p.lastSafeX = p.x;
            p.lastSafeY = b.y;
            break;
          }

          if (b.type === 'spring') {
            p.vy = SPRING_BOOST_PINE;
            audio.sfxBounce();
          } else {
            p.vy = 0;
            p.onGround = true;
            p.supportBranch = b;
            if (b.type === 'fragile' && b.cracking <= 0) {
              b.cracking = 0.48;
              audio.sfxCrumble();
            }
            if (b.type !== 'fragile') {
              p.lastSafeX = b.x;
              p.lastSafeY = b.y;
            }
          }
          break;
        }
      }

      // Zona de activación que cubre el nido y el peluche, incluso si lo toca en el aire.
      if (Math.abs(p.x - this.nest.x) < 92 && p.y >= this.nest.y - 62 && p.y <= this.nest.y + 34) {
        this.cameraY = this.nest.y + 18 - FINAL_CINEMATIC.summitBranchY;
        this.victoryStarted = true;
        audio.sfxVictory();
        audio.sfxDuck();
        cineFinal.reset({ x: p.x, y: p.y, branchY: p.y });
        currentState = STATE.CINE_FINAL;
        pendingNextState = null;
        transitionAlpha = 0;
        return;
      }

      // La cámara sigue a la niña cuando sube (Doodle Jump)
      const summitProgress = Math.max(0, Math.min(1,
        (560 - p.y) / Math.max(1, 560 - (this.nest.y + 18))
      ));
      const crownProgress = Math.max(0, Math.min(1,
        (summitProgress - SUMMIT_CROWN_START_PROGRESS) / (1 - SUMMIT_CROWN_START_PROGRESS)
      ));
      const playerCameraY = p.y - V_HEIGHT * 0.55;
      const summitCameraY = this.nest.y + 18 - FINAL_CINEMATIC.summitBranchY;
      const targetCamY = playerCameraY + (summitCameraY - playerCameraY) * crownProgress;
      if (targetCamY < this.cameraY || crownProgress > 0) {
        // Seguimiento lineal suave, sin rebote ni overshoot.
        this.cameraY += (targetCamY - this.cameraY) * 0.12;
      }

      // Caída por debajo de la pantalla: pierde una vida y reaparece en la última rama estable
      if (p.y > this.cameraY + V_HEIGHT + 40) {
        audio.sfxSplash();
        this.lives = Math.max(0, this.lives - 1);

        if (this.lives <= 0) {
          this.gameOver = true;
          return;
        }

        // Reaparece exactamente en la última rama estable previa (nunca más arriba)
        p.x = p.lastSafeX;
        p.y = p.lastSafeY;
        p.vx = 0;
        p.vy = 0;
        p.onGround = false;
        p.supportBranch = null;
        this.invulTimer = BLINK_DURATION;

        // Se conserva la cámara al reaparecer para evitar cualquier salto de pantalla.
      }
    },

    draw(ctx) {
      cineFinal.buildAssets();
      const summitProgress = Math.max(0, Math.min(1,
        (560 - this.player.y) / Math.max(1, 560 - (this.nest.y + 18))
      ));
      const crownLinearProgress = Math.max(0, Math.min(1,
        (summitProgress - SUMMIT_CROWN_START_PROGRESS) / (1 - SUMMIT_CROWN_START_PROGRESS)
      ));
      const crownProgress = crownLinearProgress * crownLinearProgress * (3 - 2 * crownLinearProgress);
      ctx.save();
      ctx.translate(0, -this.cameraY);

      // Gradiente de cielo vertical (de atardecer a cielo estelar dorado)
      const skyGrad = ctx.createLinearGradient(0, 600, 0, -this.targetHeight - 200);
      skyGrad.addColorStop(0, '#533b68');
      skyGrad.addColorStop(0.3, '#312b54');
      skyGrad.addColorStop(0.7, '#1b1c3b');
      skyGrad.addColorStop(1, '#0e1124');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, -this.targetHeight - 300, V_WIDTH, this.targetHeight + 1000);

      // Interpolación visual continua al mismo cielo prerenderizado de la cinemática.
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = summitProgress;
      ctx.drawImage(cineFinal.assets.summitSky, 0, 0);
      ctx.restore();

      // Estrellas titilantes en las alturas
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = 1 - summitProgress;
      for (let i = 0; i < 65; i++) {
        const starX = (i * 137) % V_WIDTH;
        const starY = -this.targetHeight + (i * 62);
        const blink = Math.sin(stateTime * 4 + i) * 0.4 + 0.6;
        ctx.globalAlpha = blink;
        ctx.fillRect(starX, starY, 2.5, 2.5);
      }
      ctx.globalAlpha = 1.0;

      // Tronco colosal del Gran Pino (en el centro)
      ctx.save();
      ctx.globalAlpha = 1 - crownProgress;
      const trunkWidth = 190;
      ctx.fillStyle = '#422c1d';
      ctx.fillRect(V_WIDTH / 2 - trunkWidth / 2, -this.targetHeight - 200, trunkWidth, this.targetHeight + 900);

      // Corteza del tronco
      ctx.strokeStyle = '#2b1b11';
      ctx.lineWidth = 4;
      for (let y = -this.targetHeight; y < 600; y += 75) {
        ctx.beginPath();
        ctx.moveTo(V_WIDTH / 2 - trunkWidth / 2 + 10, y);
        ctx.quadraticCurveTo(V_WIDTH / 2, y + 25, V_WIDTH / 2 + trunkWidth / 2 - 10, y);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(205, 151, 101, 0.28)';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(V_WIDTH / 2 - 52, -this.targetHeight - 120);
      ctx.lineTo(V_WIDTH / 2 - 52, 690);
      ctx.moveTo(V_WIDTH / 2 + 48, -this.targetHeight - 120);
      ctx.lineTo(V_WIDTH / 2 + 48, 690);
      ctx.stroke();
      ctx.restore();

      // La copa prerenderizada comparte escala y coordenadas con la cinemática final.
      ctx.save();
      ctx.globalAlpha = crownProgress;
      ctx.drawImage(cineFinal.assets.summitTree, 0,
        this.nest.y + 18 - FINAL_CINEMATIC.summitBranchY);
      ctx.restore();

      // Dibujar Ramas del pino
      for (const b of this.branches) {
        if (b.broken) continue;
        if (b.type === 'nestBranch') {
          ctx.save();
          ctx.globalAlpha = 1 - crownProgress;
          this.drawBranch(ctx, b);
          ctx.restore();
        } else {
          ctx.save();
          ctx.globalAlpha = 1 - crownProgress;
          this.drawBranch(ctx, b);
          ctx.restore();
        }
      }

      // Dibujar Nido del águila en la cúspide
      this.drawEagleNest(ctx, this.nest.x, this.nest.y, duckInNest);

      // Dibujar Niña saltando (parpadeante si invulnerable tras reaparecer)
      const blinkVisible = isPlayerBlinkVisible(this.invulTimer);

      if (blinkVisible) {
        const pAnim = this.player.vy < 0 ? 'jump' : 'fall';
        drawGirl(ctx, this.player.x, this.player.y, {
          scale: 1.45 + crownProgress * 0.37,
          facingRight: this.player.facingRight,
          state: pAnim,
          animTime: stateTime,
          hasDuck: false
        });
      }

      // Partículas
      particles.draw(ctx, 0, this.cameraY);

      ctx.restore();

      // HUD de altitud y vidas
      this.drawHUD(ctx);

      // Modal de Game Over
      if (this.gameOver) {
        drawGameOverModal(ctx,
          () => { this.gameOver = false; this.init(); },
          () => { this.gameOver = false; isPaused = false; switchState(STATE.MENU); }
        );
      }
    },

    drawBranch(ctx, b) {
      ctx.save();
      const inheritedAlpha = ctx.globalAlpha;
      const side = b.type === 'nestBranch' ? 0 : (b.branchSide || (b.x < V_WIDTH / 2 ? -1 : 1));
      const shake = b.cracking > 0 ? Math.sin(stateTime * 58) * 2.5 : 0;
      const left = b.x - b.w / 2 + shake;
      const top = b.y;
      const dry = b.type === 'fragile';
      const needleColor = dry ? 'rgba(197, 174, 104, 0.62)' : 'rgba(126, 177, 139, 0.55)';

      // Conector corto y cónico que nace del costado del tronco hacia la plataforma.
      const trunkEdge = side < 0 ? V_WIDTH / 2 - 95 : V_WIDTH / 2 + 95;
      const innerEdge = side < 0 ? left + b.w : left;
      ctx.fillStyle = dry ? '#987958' : '#5b3b28';
      if (b.type === 'nestBranch') {
        ctx.lineWidth = 16;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#5b3b28';
        ctx.beginPath();
        ctx.moveTo(V_WIDTH / 2 - 42, top + 35); ctx.quadraticCurveTo(V_WIDTH / 2 - 88, top + 25, left + 16, top + 9);
        ctx.moveTo(V_WIDTH / 2 + 42, top + 35); ctx.quadraticCurveTo(V_WIDTH / 2 + 88, top + 25, left + b.w - 16, top + 9);
        ctx.stroke();
      } else {
        const rootInsideTrunk = trunkEdge - side * 52;
        ctx.beginPath();
        ctx.moveTo(rootInsideTrunk, top + 6);
        ctx.lineTo(innerEdge, top + 3);
        ctx.lineTo(innerEdge, top + 17);
        ctx.lineTo(rootInsideTrunk, top + 25);
        ctx.closePath();
        ctx.fill();
      }

      // Follaje decorativo detrás y debajo de la superficie, nunca sobre la hitbox.
      ctx.globalAlpha = inheritedAlpha * 0.72;
      ctx.fillStyle = needleColor;
      if (!dry && b.type !== 'nestBranch') {
        for (let i = 0; i < 6; i++) {
          const x = left + 12 + i * ((b.w - 24) / 5);
          const y = top + 20 + (i % 2) * 5;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(x + side * 8, y + 18, x + side * 18, y + 23);
          ctx.quadraticCurveTo(x + side * 10, y + 7, x, y);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(x + side * 8, y + 12, 8, 4, side * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        ctx.strokeStyle = needleColor;
        ctx.lineWidth = 3;
        for (let i = 0; i < 5; i++) {
          const x = left + 18 + i * ((b.w - 36) / 4);
          ctx.beginPath();
          ctx.moveTo(x, top + 20);
          ctx.lineTo(x + side * 9, top + 31);
          ctx.moveTo(x, top + 22);
          ctx.lineTo(x - side * 7, top + 34);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = inheritedAlpha;

      // Plataforma sólida: esta barra, y solo esta barra, coincide con la hitbox.
      ctx.fillStyle = dry ? '#a9855d' : '#68472f';
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(left + b.w, top);
      ctx.lineTo(left + b.w, top + 12);
      ctx.quadraticCurveTo(left + b.w, top + 17, left + b.w - 5, top + 17);
      ctx.lineTo(left + 5, top + 17);
      ctx.quadraticCurveTo(left, top + 17, left, top + 12);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = dry ? '#dfc28b' : '#c79a69';
      ctx.beginPath();
      ctx.roundRect(left + 5, top, b.w - 10, 3, 2);
      ctx.fill();
      ctx.strokeStyle = dry ? 'rgba(85, 57, 35, 0.85)' : 'rgba(53, 36, 25, 0.72)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(left + 10, top + 10);
      ctx.quadraticCurveTo(b.x, top + 13, left + b.w - 10, top + 9);
      ctx.stroke();

      if (b.type === 'moving') {
        ctx.fillStyle = 'rgba(255, 230, 165, 0.9)';
        ctx.beginPath();
        ctx.arc(b.x, top + 8, 3, 0, Math.PI * 2);
        ctx.fill();
      } else if (b.type === 'spring') {
        ctx.shadowColor = 'rgba(255, 205, 93, 0.8)';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#d99152';
        ctx.beginPath();
        ctx.ellipse(b.x, top - 8, 13, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f4d18a';
        ctx.beginPath();
        ctx.arc(b.x, top - 11, 4, 0, Math.PI * 2);
        ctx.fill();
      } else if (dry) {
        ctx.strokeStyle = '#6e5039';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x - 14, top + 3);
        ctx.lineTo(b.x - 7, top + 13);
        ctx.moveTo(b.x + 15, top + 4);
        ctx.lineTo(b.x + 8, top + 14);
        ctx.stroke();
      }

      ctx.restore();
    },

    drawEagleNest(ctx, x, y, showDuck = duckInNest) {
      ctx.save();
      ctx.translate(x, y);

      // Nido profundo: cuenco posterior, paja entrelazada y plumas.
      ctx.fillStyle = '#674832';
      ctx.beginPath();
      ctx.ellipse(0, 2, 92, 34, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#a8794c';
      ctx.beginPath();
      ctx.ellipse(0, -5, 68, 19, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#d1a56e';
      ctx.lineWidth = 4;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.ellipse(0, 3 + i * 3, 76 - i * 5, 24 - i * 2, 0, 0.12, Math.PI - 0.12);
        ctx.stroke();
      }
      ctx.fillStyle = '#fff0d8';
      ctx.beginPath();
      ctx.ellipse(-35, -12, 12, 5, -0.4, 0, Math.PI * 2);
      ctx.ellipse(37, -11, 11, 5, 0.4, 0, Math.PI * 2);
      ctx.fill();

      // El peluche se dibuja aparte y solo mientras la única bandera diga que sigue aquí.
      if (showDuck) {
        const bounce = Math.sin(stateTime * 2.5) * 1.5;
        ctx.fillStyle = 'rgba(255, 230, 150, 0.20)';
        ctx.beginPath();
        ctx.arc(0, -27 + bounce, 25, 0, Math.PI * 2);
        ctx.fill();
        drawDuckPlush(ctx, 0, -26 + bounce, 1.08, 0);
      }

      // Borde frontal redondeado delante de la parte inferior del peluche.
      ctx.strokeStyle = '#795437';
      ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.ellipse(0, 3, 82, 25, 0, 0.12, Math.PI - 0.12);
      ctx.stroke();
      ctx.strokeStyle = '#e0b779';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 1, 77, 22, 0, 0.16, Math.PI - 0.16);
      ctx.stroke();

      ctx.restore();
    },

    drawHUD(ctx) {

      drawHearts(ctx, this.lives, 3, V_WIDTH / 2, 24);

      ctx.restore();
    }
  };

  // ==========================================
  // 11. CINEMÁTICA FINAL: RESCATE EN EL NIDO Y DESCENSO

  const cineFinal = {

      treeCtx.fillStyle = 'rgba(111, 157, 113, 0.65)';

      // El cuenco se renderiza por separado para poder retirar el único patito al recogerlo.

    reset(start = null) {
      this.buildAssets();
      particles.clear();
      this.timer = 0;
      duckInNest = true;
      this.cameraY = 0;
      this.startX = start ? Math.max(325, Math.min(955, start.x)) : 480;
      this.topBranchY = FINAL_CINEMATIC.summitBranchY;
      this.descentBranches = [
        { x: 435, y: 80, w: 180, branchSide: -1, type: 'normal', broken: false },
        { x: 845, y: 255, w: 190, branchSide: 1, type: 'normal', broken: false },
        { x: 435, y: 430, w: 180, branchSide: -1, type: 'normal', broken: false },
        { x: 845, y: 605, w: 190, branchSide: 1, type: 'normal', broken: false },
        { x: 435, y: 780, w: 180, branchSide: -1, type: 'normal', broken: false },
        { x: 845, y: 955, w: 190, branchSide: 1, type: 'normal', broken: false },
